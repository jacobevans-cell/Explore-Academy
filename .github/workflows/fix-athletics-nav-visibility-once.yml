name: Fix athletics nav visibility once

on:
  push:
    paths:
      - '.github/workflows/fix-athletics-nav-visibility-once.yml'

permissions:
  contents: write

jobs:
  fix-athletics-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Athletics the only visible school nav item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')

          old = '''<style id="athletics-visual-nav-lock-v2">
/* Public launch lock: only Athletics stays visible in the school header. */
.header .nav a,
.header nav a { display:none !important; }
.header .nav a[href="athletics.html"],
.header .nav a.active,
.header nav a[href="athletics.html"],
.header nav a.active { display:inline-flex !important; }
.crumb a { display:none !important; }
</style>'''

          new = '''<style id="athletics-visual-nav-lock-v3">
/* Public launch lock: only the actual active Athletics tab is visible. */
.header .nav a,
.header nav a { display:none !important; }
.header .nav a.active,
.header nav a.active { display:inline-flex !important; }
.crumb a { display:none !important; }
</style>
<script id="athletics-nav-prune-v3">
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.header nav a, .header .nav a').forEach(function (link) {
    if ((link.textContent || '').trim().toLowerCase() !== 'athletics') link.remove();
    else {
      link.classList.add('active');
      link.setAttribute('href', 'athletics.html');
      link.setAttribute('aria-current', 'page');
    }
  });
  var crumb = document.querySelector('.crumb');
  if (crumb) crumb.innerHTML = '<span>Eagles Athletics</span>';
});
</script>'''

          if old not in html:
              raise SystemExit('Expected v2 athletics nav lock block not found; refusing blind edit.')

          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          print('Installed athletics nav visibility v3.')
          PY

      - name: Commit hard athletics nav fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-athletics-nav-visibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html .github/workflows/fix-athletics-nav-visibility-once.yml
          git commit -m "Show only Athletics in public navigation"
          git push
