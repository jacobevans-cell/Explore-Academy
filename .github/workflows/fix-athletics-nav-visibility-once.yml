name: Fix athletics nav visibility once

on:
  push:
    paths:
      - '.github/workflows/fix-athletics-nav-visibility-once.yml'

permissions:
  contents: write

jobs:
  fix-athletics-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Athletics the only visible school nav item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')

          html, count = re.subn(
              r'<style id="athletics-visual-nav-lock-v2">.*?</style>',
              '<style id="athletics-visual-nav-lock-v3">\n'
              '.header .nav a, .header nav a { display:none !important; }\n'
              '.header .nav a.active, .header nav a.active { display:inline-flex !important; }\n'
              '.crumb a { display:none !important; }\n'
              '</style>\n'
              '<script id="athletics-nav-prune-v3">\n'
              "document.addEventListener('DOMContentLoaded', function () {\n"
              "document.querySelectorAll('.header nav a, .header .nav a').forEach(function (link) {\n"
              "if ((link.textContent || '').trim().toLowerCase() !== 'athletics') link.remove();\n"
              "else { link.classList.add('active'); link.setAttribute('href','athletics.html'); link.setAttribute('aria-current','page'); }\n"
              "});\n"
              "var crumb = document.querySelector('.crumb'); if (crumb) crumb.innerHTML = '<span>Eagles Athletics</span>';\n"
              "});\n"
              '</script>',
              html,
              count=1,
              flags=re.S,
          )

          if count != 1:
              raise SystemExit(f'Expected one v2 nav lock block; found {count}.')

          path.write_text(html, encoding='utf-8')
          print('Installed athletics nav visibility v3.')
          PY

      - name: Commit hard athletics nav fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-athletics-nav-visibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html .github/workflows/fix-athletics-nav-visibility-once.yml
          git commit -m "Show only Athletics in public navigation"
          git push
