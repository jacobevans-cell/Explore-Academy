name: Inject athletics team directory

on:
  push:
    paths:
      - '.github/workflows/inject-athletics-team-directory.yml'
      - '.github/scripts/inject-athletics-team-directory.py'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Explore Our Teams section
        run: python .github/scripts/inject-athletics-team-directory.py
      - name: Commit athletics page
        run: |
          if git diff --quiet -- athletics.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html
          git commit -m "Add team directory to athletics page"
          git push
