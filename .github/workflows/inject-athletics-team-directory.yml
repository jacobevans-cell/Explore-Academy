name: Inject athletics team directory

on:
  push:
    paths:
      - '.github/workflows/inject-athletics-team-directory.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Explore Our Teams section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('athletics.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '/* ===== Explore team directory ===== */'
          if css_marker not in text:
              css = r'''
/* ===== Explore team directory ===== */
.team-directory{position:relative;overflow:hidden;background:linear-gradient(135deg,#061f3d 0%,#0a2b54 52%,#123e72 100%);color:#fff}
.team-directory:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:90px solid rgba(255,255,255,.035);right:-180px;top:-250px;pointer-events:none}
.team-directory .wrap{position:relative;z-index:1}
.team-directory .eyebrow{color:#9fd2ff}
.team-directory h2{color:#fff;margin-bottom:8px;font-size:clamp(2.4rem,4.8vw,4rem);letter-spacing:-.045em}
.team-directory .team-directory-intro{max-width:780px;color:#d9e7f5;margin:0 0 28px;font-size:1.02rem}
.team-directory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.team-directory-card{--team:#176fc2;position:relative;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:18px;min-height:150px;padding:22px;border-radius:22px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--team),color-mix(in srgb,var(--team) 72%,#061b34));border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 38px rgba(0,0,0,.18);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.team-directory-card:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);right:-45px;top:-65px}
.team-directory-card:hover{transform:translateY(-4px);box-shadow:0 24px 48px rgba(0,0,0,.25)}
.team-directory-card.jv{--team:#176fc2}.team-directory-card.varsity{--team:#c9233a}.team-directory-card.boys{--team:#6841b5}.team-directory-card.flag{--team:#168a57}
.team-directory-icon{position:relative;z-index:1;width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-size:36px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.team-directory-copy{position:relative;z-index:1}.team-directory-sport{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900;opacity:.82}.team-directory-name{font-size:1.42rem;font-weight:950;line-height:1.08;margin-top:5px}.team-directory-detail{font-size:.86rem;font-weight:700;opacity:.84;margin-top:7px}
.team-directory-arrow{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--team);font-size:22px;font-weight:950}
.team-directory-note{display:flex;align-items:center;gap:10px;margin-top:20px;color:#bad7ef;font-size:.84rem;font-weight:750}.team-directory-note span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.09)}
@media(max-width:820px){.team-directory-grid{grid-template-columns:1fr}}
@media(max-width:520px){.team-directory-card{grid-template-columns:58px 1fr;padding:18px;gap:14px}.team-directory-icon{width:56px;height:56px;border-radius:16px;font-size:29px}.team-directory-arrow{grid-column:2;width:auto;height:auto;background:transparent;color:#fff;justify-content:start;font-size:.82rem}.team-directory-arrow:after{content:" View team";font-size:.82rem;margin-left:5px}.team-directory-name{font-size:1.2rem}}
'''
              text = text.replace('</style>', css + '\n</style>', 1)

          html_marker = '<!-- Explore Our Teams directory -->'
          if html_marker not in text:
              section = r'''
<!-- Explore Our Teams directory -->
<section class="section team-directory" aria-labelledby="team-directory-title"><div class="wrap">
<div class="eyebrow">Team Headquarters</div>
<h2 id="team-directory-title">Explore Our Teams</h2>
<p class="team-directory-intro">Jump straight to schedules, rosters, standings, and team updates. Each team has its own page, all connected through Explore Academy Athletics.</p>
<div class="team-directory-grid">
<a class="team-directory-card jv" href="athletics-portal/teams/jv-girls-volleyball.html"><span class="team-directory-icon" aria-hidden="true">🏐</span><span class="team-directory-copy"><span class="team-directory-sport">Volleyball • CAA Elementary</span><span class="team-directory-name">JV Girls Volleyball</span><span class="team-directory-detail">Schedule • Roster • Standings</span></span><span class="team-directory-arrow" aria-hidden="true">→</span></a>
<a class="team-directory-card varsity" href="athletics-portal/teams/varsity-girls-volleyball.html"><span class="team-directory-icon" aria-hidden="true">🏐</span><span class="team-directory-copy"><span class="team-directory-sport">Volleyball • Varsity</span><span class="team-directory-name">Varsity Girls Volleyball</span><span class="team-directory-detail">Schedule • Roster • Team Updates</span></span><span class="team-directory-arrow" aria-hidden="true">→</span></a>
<a class="team-directory-card boys" href="athletics-portal/teams/boys-volleyball.html"><span class="team-directory-icon" aria-hidden="true">🏐</span><span class="team-directory-copy"><span class="team-directory-sport">Volleyball • Boys</span><span class="team-directory-name">Boys Volleyball</span><span class="team-directory-detail">Roster • Schedule • Program Info</span></span><span class="team-directory-arrow" aria-hidden="true">→</span></a>
<a class="team-directory-card flag" href="athletics-portal/teams/co-ed-flag-football.html"><span class="team-directory-icon" aria-hidden="true">🏈</span><span class="team-directory-copy"><span class="team-directory-sport">Flag Football • Co-ed</span><span class="team-directory-name">Co-ed Flag Football</span><span class="team-directory-detail">Roster • Schedule • Program Info</span></span><span class="team-directory-arrow" aria-hidden="true">→</span></a>
</div>
<div class="team-directory-note"><span aria-hidden="true">🦅</span> Explore Academy team pages open directly. No family login required.</div>
</div></section>
'''
              anchor = '<section class="section"><div class="wrap"><div class="split">\n<div><div class="eyebrow">Explore Academy Athletics • 2026–27</div>'
              if anchor not in text:
                  raise SystemExit('Could not find athletics insertion anchor')
              text = text.replace(anchor, section + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit athletics page
        run: |
          if git diff --quiet -- athletics.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html
          git commit -m "Add team directory to athletics page"
          git push
