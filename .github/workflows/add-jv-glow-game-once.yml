name: Add JV glow game once
on:
  push:
    paths:
      - '.github/workflows/add-jv-glow-game-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add glow game and styling
        run: |
          python - <<'PY'
          from pathlib import Path

          data = Path('athletics-portal/teams/shared/team-data.js')
          s = data.read_text()
          needle = "      { date: 'Sep 16', time: 'During School', opponent: 'Explore Academy Staff', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'During School', detail: '🏫 STAFF VS STUDENTS • Exhibition Game' }\n"
          repl = needle.rstrip('\n') + ",\n      { date: 'Sep 24', time: '5:45 PM', opponent: 'Sequoia Pathfinder', arrival: '5:15 PM', detail: '✨ GLOW IN THE DARK GAME • Fun Game • Ends 7:45 PM' }\n"
          if "date: 'Sep 24'" not in s:
              if needle not in s:
                  raise SystemExit('JV insertion point not found')
              s = s.replace(needle, repl, 1)
          data.write_text(s)

          js = Path('athletics-portal/teams/shared/team-page.js')
          s = js.read_text()
          old = "function gameCard(game,index,total,team){const weekday=weekdayForGame(game);const isVarsity=team?.id==='varsity-girls-volleyball';const location=String(game.location||'').toLowerCase();const varsityClass=isVarsity&&location==='home'?' varsity-home':isVarsity&&location==='away'?' varsity-away':'';const locationBadge=isVarsity&&location==='home'?'<div class=\"location-badge home\">🏠 HOME</div>':isVarsity&&location==='away'?'<div class=\"location-badge away\">🚌 AWAY</div>':'';return `<div class=\"card game-card${varsityClass}${game.detail?.toLowerCase().includes('pink out')?' pink-out':''}\">${locationBadge}"
          new = "function gameCard(game,index,total,team){const weekday=weekdayForGame(game);const isVarsity=team?.id==='varsity-girls-volleyball';const location=String(game.location||'').toLowerCase();const varsityClass=isVarsity&&location==='home'?' varsity-home':isVarsity&&location==='away'?' varsity-away':'';const locationBadge=isVarsity&&location==='home'?'<div class=\"location-badge home\">🏠 HOME</div>':isVarsity&&location==='away'?'<div class=\"location-badge away\">🚌 AWAY</div>':'';const detail=String(game.detail||'').toLowerCase();const specialClass=detail.includes('pink out')?' pink-out':detail.includes('glow in the dark')?' glow-game':'';return `<div class=\"card game-card${varsityClass}${specialClass}\">${locationBadge}"
          if "glow-game" not in s:
              if old not in s:
                  raise SystemExit('gameCard patch point not found')
              s = s.replace(old, new, 1)
          s = s.replace("./team-data.js?v=20260904-11", "./team-data.js?v=20260909-1", 1)
          js.write_text(s)

          css = Path('athletics-portal/teams/shared/team-pages.css')
          s = css.read_text()
          marker = ".pink-out{position:relative;"
          glow = ".glow-game{position:relative;border:4px solid #78ff3d!important;background:radial-gradient(circle at 18% 12%,rgba(173,72,255,.32),transparent 28%),radial-gradient(circle at 86% 18%,rgba(0,229,255,.28),transparent 26%),linear-gradient(145deg,#070316 0,#13072b 48%,#041b2c 100%)!important;box-shadow:0 0 0 2px #9b4dff,0 0 24px rgba(120,255,61,.42),0 0 46px rgba(0,229,255,.28)!important;color:#fff}.glow-game:before{content:'✨ GLOW IN THE DARK GAME';display:block;background:linear-gradient(90deg,#8a2eff,#00dff6 52%,#7cff3b);color:#08111f;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:950;letter-spacing:.07em;text-align:center;text-shadow:0 0 10px rgba(255,255,255,.75);box-shadow:0 0 18px rgba(138,46,255,.65),0 0 26px rgba(0,223,246,.45)}.glow-game .card-title,.glow-game .game-opponent{color:#fff;text-shadow:0 0 8px rgba(0,229,255,.7)}.glow-game .card-label{color:#b9ff9b}.glow-game .event-badge{background:#16102b;color:#baff8f;border:2px solid #78ff3d;font-size:12px;box-shadow:0 0 12px rgba(120,255,61,.5);white-space:normal}.glow-game .travel-plan{background:linear-gradient(145deg,#12072a,#071b38 55%,#052628);border-color:#00e5ff;box-shadow:0 0 20px rgba(0,229,255,.28)}.glow-game .travel-venue{background:rgba(123,255,61,.07);border-color:rgba(123,255,61,.45)}.glow-game .travel-stats>div{box-shadow:inset 0 0 0 2px #8d4cff,0 0 12px rgba(141,76,255,.25)}.glow-game .maps-button{color:#32136b;border:2px solid #78ff3d;box-shadow:0 0 12px rgba(120,255,61,.32)}"
          if ".glow-game{" not in s:
              if marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(marker, glow + marker, 1)
          css.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/add-jv-glow-game-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add athletics-portal/teams/shared/team-data.js athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/team-pages.css .github/workflows/add-jv-glow-game-once.yml
          git commit -m 'Add JV Glow in the Dark game'
          git push
