name: Style Marley support once
on:
  push:
    paths:
      - '.github/workflows/style-marley-support-once.yml'
permissions:
  contents: write
jobs:
  style-marley:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Marley styling
        run: python scripts/style_marley_support.py
      - name: Commit styling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/style-marley-support-once.yml scripts/style_marley_support.py
          git add athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/practice-week.css
          git commit -m "Make Marley support event vibrant"
          git push
