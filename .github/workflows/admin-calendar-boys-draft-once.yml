name: Add boys draft games to admin calendar
on:
  push:
    paths:
      - '.github/workflows/admin-calendar-boys-draft-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin calendar only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('athletics-portal/admin-calendar.html')
          s = p.read_text()
          old = "const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\\"/g,'&quot;').replace(/'/g,'&#039;');const teams=Object.values(TEAM_DATA),YEAR=2026;"
          new = """const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\\"/g,'&quot;').replace(/'/g,'&#039;');\nconst ADMIN_BOYS_GAMES=[\n  {date:'Oct 19',time:'',opponent:'Empower College Prep',location:'Away'},\n  {date:'Oct 21',time:'',opponent:'Adams Traditional Academy',location:'Home'},\n  {date:'Oct 26',time:'',opponent:'Academy of Math and Science Flower',location:'Away'},\n  {date:'Oct 28',time:'',opponent:'Imagine at Cortez Park',location:'Home'},\n  {date:'Nov 2',time:'',opponent:'Pensar Academy',location:'Away'},\n  {date:'Nov 4',time:'',opponent:'Freedom Academy',location:'Away'},\n  {date:'Nov 9',time:'',opponent:'Hearn Academy',location:'Away'},\n  {date:'Nov 11',time:'',opponent:'ALA West Foothills Team 2',location:'Home',detail:'Required Non-Region'},\n  {date:'Nov 16',time:'',opponent:'Stepping Stones Academy',location:'Home'},\n  {date:'Nov 18',time:'',opponent:'Liberty Traditional School',location:'Home'}\n];\nconst teams=Object.values(TEAM_DATA).map(t=>t.id==='boys-volleyball'?{...t,games:ADMIN_BOYS_GAMES}:t),YEAR=2026;"""
          if old not in s:
              raise SystemExit('Target declaration not found; refusing unsafe patch')
          s = s.replace(old,new,1)
          # Make it explicit that boys dates are admin planning only.
          old2 = "<p>Games only • color-coded by sport and team • conflicts flagged automatically</p>"
          new2 = "<p>Games only • color-coded by sport and team • conflicts flagged automatically • Boys dates include the admin planning schedule</p>"
          if old2 not in s:
              raise SystemExit('Header target not found; refusing unsafe patch')
          s = s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/admin-calendar-boys-draft-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add athletics-portal/admin-calendar.html .github/workflows/admin-calendar-boys-draft-once.yml
          git commit -m 'Include boys draft dates in admin master calendar'
          git push