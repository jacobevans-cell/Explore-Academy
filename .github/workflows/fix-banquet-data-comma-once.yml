name: Fix banquet data comma once

on:
  push:
    paths:
      - '.github/workflows/fix-banquet-data-comma-once.yml'

permissions:
  contents: write

jobs:
  fix-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Varsity events separator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('athletics-portal/teams/shared/team-data.js')
          s = p.read_text()
          bad = "      { date: 'Nov 9', time: '4:45 PM', opponent: 'CASA Academy', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: '4:15 PM', detail: '⚠️ OUTDOOR • CONCRETE COURT' }\n    ]\n    events: ["
          good = "      { date: 'Nov 9', time: '4:45 PM', opponent: 'CASA Academy', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: '4:15 PM', detail: '⚠️ OUTDOOR • CONCRETE COURT' }\n    ],\n    events: ["
          if bad not in s:
              raise SystemExit('Varsity comma marker not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          rm .github/workflows/fix-banquet-data-comma-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics-portal/teams/shared/team-data.js .github/workflows/fix-banquet-data-comma-once.yml
          git commit -m "Fix Varsity banquet event data syntax"
          git push
