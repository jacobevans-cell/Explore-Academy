name: Update elementary athletics dates once

on:
  push:
    paths:
      - '.github/workflows/update-elementary-athletics-dates-once.yml'

permissions:
  contents: write

jobs:
  update-elementary-athletics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update public elementary athletics cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Update Boys Volleyball public card date.
          marker = '<h3>Boys Volleyball</h3>'
          pos = html.find(marker)
          if pos == -1:
              raise SystemExit('Boys Volleyball card not found')
          article_start = html.rfind('<article', 0, pos)
          article_end = html.find('</article>', pos)
          if article_start == -1 or article_end == -1:
              raise SystemExit('Could not isolate Boys Volleyball card')
          article_end += len('</article>')
          article = html[article_start:article_end]
          old_date = 'Oct. 14–Dec. 4'
          if old_date not in article:
              raise SystemExit('Expected old Boys Volleyball date not found')
          article = article.replace(old_date, 'Sep. 28–Dec. 4', 1)
          html = html[:article_start] + article + html[article_end:]

          # Remove the obsolete Girls Flag Football card entirely.
          marker = '<h3>Girls Flag Football</h3>'
          pos = html.find(marker)
          if pos == -1:
              raise SystemExit('Girls Flag Football card not found')
          article_start = html.rfind('<article', 0, pos)
          article_end = html.find('</article>', pos)
          if article_start == -1 or article_end == -1:
              raise SystemExit('Could not isolate Girls Flag Football card')
          article_end += len('</article>')
          html = html[:article_start] + html[article_end:]

          if html == original:
              raise SystemExit('No athletics.html changes made')
          path.write_text(html, encoding='utf-8')
          print('Updated Boys Volleyball to Sep. 28–Dec. 4 and removed Girls Flag Football card.')
          PY

      - name: Keep athletics seed data aligned
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('athletics-portal/js/seed-data.js')
          text = path.read_text(encoding='utf-8')
          original = text

          # Elementary late-fall window is now Boys Volleyball only.
          text = text.replace(
              'id: "elem-late-fall",\n    audience: "Elementary",\n    grades: "4–5",\n    label: "Late Fall",\n    start: "2026-10-14",\n    end: "2026-12-04",\n    purpose: "Elementary boys volleyball and girls flag football"',
              'id: "elem-late-fall",\n    audience: "Elementary",\n    grades: "4–5",\n    label: "Late Fall",\n    start: "2026-09-28",\n    end: "2026-12-04",\n    purpose: "Elementary boys volleyball"',
              1
          )

          # Boys Volleyball starts Sep 28 in the admin/registration data too.
          boys_marker = 'id:"elem-boys-vb"'
          boys_pos = text.find(boys_marker)
          if boys_pos == -1:
              raise SystemExit('elem-boys-vb seed entry not found')
          boys_end = text.find('\n  },', boys_pos)
          boys_block = text[boys_pos:boys_end]
          if 'competitionStart:"2026-10-14"' not in boys_block:
              raise SystemExit('Expected old Boys Volleyball competitionStart not found')
          boys_block = boys_block.replace('competitionStart:"2026-10-14"', 'competitionStart:"2026-09-28"', 1)
          text = text[:boys_pos] + boys_block + text[boys_end:]

          # Remove obsolete elementary Girls Flag Football team definition.
          pattern = r'\n  \{\n    id:"elem-girls-flag",.*?\n  \},'
          text, removed = re.subn(pattern, '', text, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit(f'Expected to remove one elem-girls-flag block, removed={removed}')

          if text == original:
              raise SystemExit('No seed-data changes made')
          path.write_text(text, encoding='utf-8')
          print('Updated elementary athletics seed data.')
          PY

      - name: Commit elementary athletics update
        shell: bash
        run: |
          rm -f .github/workflows/update-elementary-athletics-dates-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html athletics-portal/js/seed-data.js .github/workflows/update-elementary-athletics-dates-once.yml
          git commit -m "Update elementary athletics dates and remove girls flag football"
          git push
