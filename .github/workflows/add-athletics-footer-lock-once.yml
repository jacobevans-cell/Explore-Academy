name: Add athletics footer lock once

on:
  push:
    paths:
      - '.github/workflows/add-athletics-footer-lock-once.yml'

permissions:
  contents: write

jobs:
  add-footer-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject athletics footer lock script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="athletics-footer-lock.js?v=1"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('Could not find </body> in athletics.html')
              html = html.replace('</body>', tag + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')
              print('Injected athletics footer lock script.')
          else:
              print('Footer lock script already present.')
          PY

      - name: Commit footer lock
        shell: bash
        run: |
          rm -f .github/workflows/add-athletics-footer-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html .github/workflows/add-athletics-footer-lock-once.yml
          git commit -m "Restrict athletics footer to athletics pages"
          git push
