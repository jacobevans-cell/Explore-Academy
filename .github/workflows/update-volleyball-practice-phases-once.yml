name: Update volleyball practice phases once
on:
  push:
    paths:
      - '.github/workflows/update-volleyball-practice-phases-once.yml'
permissions:
  contents: write
jobs:
  update-practice-phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update phased practice logic and weekly events
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('athletics-portal/teams/shared/team-page.js')
          s = p.read_text()

          # Keep existing Friday dates and time. Add date-aware practice helpers.
          marker = "function practiceGameConflicts(){const map=new Map();"
          insert = r'''function teamEventsByDate(){const map=new Map();for(const team of Object.values(TEAM_DATA)){for(const event of team.events||[]){const date=gameDate(event);if(!date)continue;const key=dateKey(date);if(!map.has(key))map.set(key,[]);map.get(key).push({team,event});}}return map;}
function weeklyEventText(items){return items.map(({team,event})=>`${event.title||'Team Event'}${event.time?` • ${event.time}`:''}${event.location?` • ${event.location}`:''}`).join(' • ');}
function scheduledPracticeTime(team,date,day){
  const key=dateKey(date);
  const afterSep27=key>='2026-09-28';
  const boysStart=key>='2026-10-05';
  const girlsDone=key>='2026-11-20';
  if(team.id==='varsity-girls-volleyball'){
    if(key>='2026-09-28'&&key<='2026-10-04')return '3:15–5:15 PM';
    if(key>='2026-10-05'&&key<='2026-11-19'){
      if(day==='Monday'||day==='Wednesday')return '3:15–5:15 PM';
      if(day==='Tuesday'||day==='Thursday')return '4:45–6:30 PM';
    }
  }
  if(team.id==='boys-volleyball'){
    if(key>='2026-10-05'&&key<='2026-11-19'&&(day==='Tuesday'||day==='Thursday'))return '3:15–4:45 PM';
    if(key>='2026-11-20'&&day!=='Friday')return '3:15–4:30 PM';
  }
  const item=(team.practice||[]).find(x=>x.day===day);
  return item?.time||'';
}
function practiceGameConflicts(){const map=new Map();'''
          if marker not in s:
              raise SystemExit('practice conflict marker not found')
          s = s.replace(marker, insert, 1)

          # Replace the volleyball practice() function with date-aware phases and weekly events.
          pat = re.compile(r"function practice\(team,weekOffset=0\)\{.*?\n\}\nfunction renderPractice", re.S)
          new = r'''function practice(team,weekOffset=0){
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const dates=weekDates(weekOffset);
  const conflictsByDate=practiceGameConflicts();
  const eventsByDate=teamEventsByDate();
  const cards=days.map((day,index)=>{
    const date=dates[index];
    const key=dateKey(date);
    const dateLabel=date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const schoolClosure=SCHOOL_CLOSED_DATES.get(key);
    if(schoolClosure)return schoolClosureCard(day,date,schoolClosure);
    const dayEvents=(eventsByDate.get(key)||[]).filter(x=>x.team.id===team.id);
    const eventNote=dayEvents.length?`<div class="practice-week-event">📅 ${esc(weeklyEventText(dayEvents))}</div>`:'';
    if(!teamIsInSeason(team,date)&&!dayEvents.length)return outOfSeasonCard(team,day,date);
    const conflicts=conflictsByDate.get(key)||[];
    if(conflicts.length){
      return `<div class="card practice-card practice-conflict"><div class="practice-day-row"><div><div class="card-title">${day}</div><div class="practice-date">${esc(dateLabel)}</div></div><span class="practice-status conflict">GAME DAY</span></div><div class="practice-cancel">NO PRACTICE</div><div class="practice-reason">🚫 ${esc(conflictText(conflicts))}</div>${eventNote}<div class="practice-note">Volleyball practice is canceled on game days because the same coach covers the volleyball teams.</div></div>`;
    }
    if(day==='Friday'){
      const workFriday=VOLLEYBALL_WORK_FRIDAYS.has(key);
      if(!workFriday){
        return `<div class="card practice-card practice-off"><div class="practice-day-row"><div><div class="card-title">Friday</div><div class="practice-date">${esc(dateLabel)}</div></div><span class="practice-status off">NO PRACTICE</span></div><div class="practice-rest">Coach not working this Friday</div>${eventNote}</div>`;
      }
      const activeIds=VOLLEYBALL_TEAM_IDS.filter(id=>{const t=teamById(id);return t&&teamIsInSeason(t,date);});
      const mixed=key>='2026-10-05'&&activeIds.includes('varsity-girls-volleyball')&&activeIds.includes('boys-volleyball');
      const fridayTime=key>='2026-11-20'&&team.id==='boys-volleyball'?'3:15–4:30 PM':VOLLEYBALL_FRIDAY_TIME;
      return `<div class="card practice-card practice-active"><div class="practice-day-row"><div><div class="card-title">Friday</div><div class="practice-date">${esc(dateLabel)}</div></div><span class="practice-status active">PRACTICE</span></div><div class="card-value practice-time">${esc(fridayTime)}</div><div class="practice-note">${mixed?'🏐 Mixed Varsity Girls + Boys practice':'🏐 Volleyball practice'}</div>${eventNote}</div>`;
    }
    if(!teamIsInSeason(team,date)){
      if(dayEvents.length)return `<div class="card practice-card practice-off"><div class="practice-day-row"><div><div class="card-title">${day}</div><div class="practice-date">${esc(dateLabel)}</div></div><span class="practice-status off">EVENT</span></div>${eventNote}</div>`;
      return outOfSeasonCard(team,day,date);
    }
    const time=scheduledPracticeTime(team,date,day);
    if(!time){
      return `<div class="card practice-card practice-off"><div class="practice-day-row"><div><div class="card-title">${day}</div><div class="practice-date">${esc(dateLabel)}</div></div><span class="practice-status off">NO PRACTICE</span></div><div class="practice-rest">Scheduled off day</div>${eventNote}</div>`;
    }
    return `<div class="card practice-card practice-active"><div class="practice-day-row"><div><div class="card-title">${day}</div><div class="practice-date">${esc(dateLabel)}</div></div><span class="practice-status active">PRACTICE</span></div><div class="card-value practice-time">${esc(time)}</div>${eventNote}</div>`;
  }).join('');
  return {banner:'Practice, games & team events',cards};
}
function renderPractice'''
          s2,n=pat.subn(new,s,count=1)
          if n!=1:
              raise SystemExit(f'practice replacement count {n}')
          s=s2

          # Add lightweight weekly-event styling.
          p.write_text(s)

          cssp=Path('athletics-portal/teams/shared/practice-week.css')
          css=cssp.read_text()
          if '.practice-week-event' not in css:
              css += '\n.practice-week-event{margin-top:10px;padding:9px 10px;border-radius:12px;background:#eef5fb;border:1px solid #c8dced;color:#0a315f;font-size:11px;font-weight:900;line-height:1.35}\n'
          cssp.write_text(css)
          PY
      - name: Commit phased practice update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-volleyball-practice-phases-once.yml
          git add athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/practice-week.css
          git commit -m "Add phased volleyball practices and weekly events"
          git push
