name: Admin specials fix 2
on:
  push:
    paths:
      - .github/workflows/admin-specials-fix2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin calendar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('athletics-portal/admin-calendar.html')
          s=p.read_text()
          s=s.replace("function isPink(g){return /pink out/i.test(String(g.detail||''))}","function isPink(g){return /pink out/i.test(String(g.detail||''))}function isGlow(g){return /glow in the dark/i.test(String(g.detail||''))}function isCampus(g){return /staff vs students/i.test(String(g.detail||''))}")
          s=s.replace("function parseDate(g){const d=new Date(`${g.date}, ${YEAR} ${g.time||'12:00 PM'}`);return Number.isNaN(d.getTime())?null:d}","function parseDate(g){let d=new Date(`${g.date}, ${YEAR} ${g.time||'12:00 PM'}`);if(Number.isNaN(d.getTime()))d=new Date(`${g.date}, ${YEAR} 12:00 PM`);return Number.isNaN(d.getTime())?null:d}")
          s=s.replace("pink=isPink(game),weekday=", "pink=isPink(game),glow=isGlow(game),campus=isCampus(game),weekday=")
          s=s.replace("${pink?'pink-out':''} ${conflictedGames.has(item)?'conflict':''}", "${pink?'pink-out':glow?'glow-game':campus?'campus-clash':''} ${conflictedGames.has(item)?'conflict':''}")
          s=s.replace("<div class=\"sport-icon\">${pink?'🎀':sportIcon(team)}</div>","<div class=\"sport-icon\">${pink?'🎀':glow?'✨':campus?'🏫':sportIcon(team)}</div>")
          s=s.replace("${pink?'<div class=\"pink-ribbon\">PINK OUT GAME</div>':''}</div>`}","${pink?'<div class=\"pink-ribbon\">PINK OUT GAME</div>':glow?'<div class=\"special-ribbon glow-ribbon\">✨ GLOW IN THE DARK GAME</div>':campus?'<div class=\"special-ribbon campus-ribbon\">🏫 CAMPUS CLASH • STAFF VS STUDENTS</div>':''}</div>`}")
          s=s.replace(".date-block{", ".game-card.glow-game{background:linear-gradient(100deg,#080b22,#15114a 45%,#071d38);border:2px solid #43e8ff;border-left:8px solid #b834ff;box-shadow:0 10px 28px rgba(86,42,255,.28)}.game-card.glow-game .date-block{background:#17124f;color:#78f4ff}.game-card.glow-game .game-team,.game-card.glow-game .game-opponent,.game-card.glow-game .game-meta{color:#fff}.game-card.campus-clash{background:linear-gradient(100deg,#fff8dd,#fff 48%,#edf4fb);border:2px solid #d8a928;border-left:8px solid #0a315f}.game-card.campus-clash .date-block{background:#0a315f;color:#ffd966}.special-ribbon{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:950;white-space:nowrap}.glow-ribbon{background:linear-gradient(90deg,#762cff,#13d9ff);color:#fff;border:2px solid #8ff6ff}.campus-ribbon{background:#0a315f;color:#ffd966;border:2px solid #d8a928}.date-block{",1)
          s=s.replace("team-data.js?v=20260904-6","team-data.js?v=20260911-specials2")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/admin-specials-fix2.yml
          git add athletics-portal/admin-calendar.html
          git commit -m 'Fix Campus Clash and Glow Game in admin calendar'
          git push
