name: Restyle Campus Clash red white blue once

on:
  push:
    paths:
      - '.github/workflows/restyle-campus-clash-rwb-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle Campus Clash and bust JV cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('athletics-portal/teams/shared/team-pages.css')
          css = css_path.read_text()
          new_block = r""".campus-clash{position:relative;border:5px solid #e31837!important;background:linear-gradient(135deg,#f8fbff 0,#d9e1ea 18%,#ffffff 37%,#c8d2de 50%,#ffffff 64%,#e8eef5 82%,#f9fbff 100%)!important;box-shadow:0 0 0 3px #0b4ea2,0 18px 42px rgba(6,43,84,.28),inset 0 0 28px rgba(255,255,255,.9)!important;overflow:hidden;color:#082b5b}.campus-clash:before{content:'🏫 CAMPUS CLASH';display:block;background:linear-gradient(180deg,#ff4a62 0,#e31837 42%,#a90720 58%,#ed2040 100%);color:#fff;border:3px solid #fff;outline:3px solid #0b4ea2;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:950;letter-spacing:.08em;text-align:center;text-shadow:0 2px 1px rgba(0,0,0,.28);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 8px rgba(71,0,12,.32),0 9px 20px rgba(11,78,162,.25)}.campus-clash:after{content:'';position:absolute;left:7%;right:7%;top:84px;height:5px;border-radius:999px;background:linear-gradient(90deg,#0b4ea2,#fff 35%,#e31837 65%,#0b4ea2);box-shadow:0 1px 6px rgba(11,78,162,.35);pointer-events:none}.campus-clash .game-top{position:relative;z-index:1;background:linear-gradient(135deg,#ffffff 0,#eef3f8 45%,#ffffff 100%);border:2px solid #b8c7d8;border-left:7px solid #0b4ea2;border-right:7px solid #e31837;border-radius:16px;padding:14px;box-shadow:inset 0 1px 0 #fff,0 8px 18px rgba(8,43,91,.10)}.campus-clash .card-title{color:#082b5b!important;text-shadow:none;font-size:20px}.campus-clash .card-label{color:#d31330!important;font-weight:950}.campus-clash .game-opponent{color:#082b5b!important;background:linear-gradient(90deg,#f2f7fc,#fff 50%,#f9edf0);border:2px solid #cad6e3;border-left:7px solid #e31837;border-radius:15px;padding:15px;margin-top:0;text-shadow:none}.campus-clash .event-badge{background:linear-gradient(180deg,#1972cf 0,#0b4ea2 48%,#07356f 52%,#1264b8 100%);color:#fff;border:3px solid #fff;outline:2px solid #e31837;border-radius:14px;font-size:12px;white-space:normal;text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 6px 14px rgba(11,78,162,.24);text-shadow:0 1px 1px rgba(0,0,0,.22)}.campus-clash .travel-plan{background:linear-gradient(145deg,#0a2d60 0,#176dbd 27%,#0a4384 51%,#155fa8 74%,#071f45 100%);border:3px solid #e31837;outline:2px solid #fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -10px 24px rgba(0,15,47,.28),0 12px 28px rgba(8,31,63,.30);color:#fff}.campus-clash .travel-head{color:#fff;border-bottom:2px solid rgba(255,255,255,.55);text-shadow:0 1px 1px rgba(0,0,0,.24)}.campus-clash .travel-head small{color:#fff;opacity:1}.campus-clash .travel-venue{background:linear-gradient(135deg,#fff 0,#e9eef5 48%,#fff 100%);border:3px solid #fff;outline:2px solid #e31837;color:#082b5b;box-shadow:inset 0 1px 0 #fff,0 5px 12px rgba(0,0,0,.12)}.campus-clash .travel-venue strong{color:#082b5b}.campus-clash .travel-venue span{color:#2e4f75!important}.campus-clash .travel-stats>div{background:linear-gradient(180deg,#fff 0,#edf2f7 48%,#fff 100%);color:#082b5b;border:2px solid #fff;outline:2px solid #e31837;box-shadow:inset 0 2px 0 #fff,0 5px 12px rgba(0,0,0,.12)}.campus-clash .travel-stats small{color:#5b6f89}.campus-clash .travel-stats strong{color:#082b5b}.campus-clash .maps-button{background:linear-gradient(180deg,#ff4059 0,#e31837 45%,#a90922 55%,#ee2342 100%);color:#fff;border:3px solid #fff;outline:2px solid #0b4ea2;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 7px 16px rgba(8,43,91,.24);text-shadow:0 1px 1px rgba(0,0,0,.22)}.campus-clash .maps-button:hover{background:linear-gradient(180deg,#ff5b70,#ef2342 48%,#bd0a28 52%,#f33450)}"""
          pattern = re.compile(r"\.campus-clash\{.*?(?=\.pink-out\{)", re.S)
          css2, n = pattern.subn(new_block, css, count=1)
          if n != 1:
              raise SystemExit(f'Expected one Campus Clash CSS block, found {n}')
          css_path.write_text(css2)

          jv_path = Path('athletics-portal/teams/jv-girls-volleyball.html')
          jv = jv_path.read_text()
          old = 'shared/team-pages.css?v=20260904-10'
          new = 'shared/team-pages.css?v=20260909-3'
          if old not in jv:
              raise SystemExit('JV CSS cache-bust token not found')
          jv_path.write_text(jv.replace(old, new, 1))
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          rm .github/workflows/restyle-campus-clash-rwb-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add athletics-portal/teams/shared/team-pages.css athletics-portal/teams/jv-girls-volleyball.html .github/workflows/restyle-campus-clash-rwb-once.yml
          git commit -m 'Restyle Campus Clash in metallic red white and blue'
          git push
