name: Marley support no practice once
on:
  push:
    paths:
      - '.github/workflows/marley-support-no-practice-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Marley support event replace practice
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('athletics-portal/teams/shared/team-page.js')
          s=p.read_text()
          old="const isMarleySupport=dayEvents.some(({event})=>/support marley yee/i.test(String(event.title||'')));const eventNote=dayEvents.length?`<div class=\"practice-week-event${isMarleySupport?' marley-support-event':''}\">${isMarleySupport?'📣 💙':'📅'} ${esc(weeklyEventText(dayEvents))}${isMarleySupport?'<div class=\"marley-support-tag\">G4 TEAMMATE SUPPORT NIGHT</div><div class=\"marley-support-message\">🏐 Show up. Cheer loud. Support Marley.</div>':''}</div>`:'';"
          if old not in s:
              raise SystemExit('Marley event marker not found')
          new=old+"\n    if(isMarleySupport)return `<div class=\"card practice-card marley-support-only\"><div class=\"practice-day-row\"><div><div class=\"card-title\">${day}</div><div class=\"practice-date\">${esc(dateLabel)}</div></div><span class=\"practice-status marley\">TEAM SUPPORT</span></div>${eventNote}</div>`;"
          s=s.replace(old,new,1)
          p.write_text(s)

          cssp=Path('athletics-portal/teams/shared/practice-week.css')
          css=cssp.read_text()
          if '.marley-support-only' not in css:
              css += '\n.marley-support-only{border:3px solid #c21432;border-top:7px solid #0a315f;background:linear-gradient(180deg,#f7fbff,#fff);box-shadow:0 14px 30px rgba(7,29,57,.14)}.practice-status.marley{background:linear-gradient(90deg,#0a315f,#c21432);color:#fff;border:1px solid #fff;box-shadow:0 4px 10px rgba(7,29,57,.18)}\n'
          cssp.write_text(css)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/marley-support-no-practice-once.yml
          git add athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/practice-week.css
          git commit -m "Make Sep 17 Marley support event only"
          git push
