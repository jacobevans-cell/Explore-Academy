name: Lock athletics navigation once

on:
  push:
    paths:
      - '.github/workflows/lock-athletics-navigation-once.yml'

permissions:
  contents: write

jobs:
  lock-athletics-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restrict public navigation to athletics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Logo/brand stays inside Athletics rather than opening unfinished Home.
          html, brand_count = re.subn(
              r'(<a\s+class=["\']brand["\']\s+href=)["\']index\.html["\']',
              r'\1"athletics.html"',
              html,
              count=1,
              flags=re.I,
          )

          # Top utility links become athletics-only.
          html, utility_count = re.subn(
              r'<div\s+class=["\']topbar-links["\']>.*?</div>',
              '<div class="topbar-links"><a href="athletics.html" aria-current="page">Athletics Portal</a></div>',
              html,
              count=1,
              flags=re.I | re.S,
          )

          # The actual page uses class="nav". Replace the whole bar with Athletics only.
          html, main_count = re.subn(
              r'<nav\s+class=["\']nav["\'][^>]*>.*?</nav>',
              '<nav class="nav" id="mainNav" aria-label="Athletics navigation"><a class="active" href="athletics.html" aria-current="page">Athletics</a></nav>',
              html,
              count=1,
              flags=re.I | re.S,
          )

          # Remove Home from the athletics breadcrumb if present.
          html = re.sub(
              r'<div\s+class=["\']crumb["\']>\s*<a\s+href=["\']index\.html["\']>Home</a>\s*<span>\s*/\s*</span>\s*<span>Eagles Athletics</span>\s*</div>',
              '<div class="crumb"><span>Eagles Athletics</span></div>',
              html,
              count=1,
              flags=re.I | re.S,
          )

          # Footer: remove routes into unfinished school pages and keep athletics destinations.
          footer_start = html.lower().find('<footer')
          if footer_start != -1:
              footer = html[footer_start:]
              footer = re.sub(
                  r'<div>\s*<h3>Explore</h3>\s*<div\s+class=["\']footer-links["\']>.*?</div>\s*</div>',
                  '<div><h3>Athletics</h3><div class="footer-links">'
                  '<a href="athletics.html">Eagles Athletics</a>'
                  '<a href="athletics-portal/teams/jv-girls-volleyball.html">JV Girls Volleyball</a>'
                  '<a href="athletics-portal/teams/varsity-girls-volleyball.html">Varsity Girls Volleyball</a>'
                  '<a href="athletics-portal/teams/boys-volleyball.html">Boys Volleyball</a>'
                  '<a href="athletics-portal/teams/co-ed-flag-football.html">Co-ed Flag Football</a>'
                  '</div></div>',
                  footer,
                  count=1,
                  flags=re.I | re.S,
              )
              footer = re.sub(
                  r'<div>\s*<h3>Families</h3>\s*<div\s+class=["\']footer-links["\']>.*?</div>\s*</div>',
                  '',
                  footer,
                  count=1,
                  flags=re.I | re.S,
              )
              html = html[:footer_start] + footer

          if utility_count != 1 or main_count != 1:
              raise SystemExit(f'Expected one utility and one main nav; found utility={utility_count}, main={main_count}.')
          if html == original:
              raise SystemExit('No changes were made.')

          path.write_text(html, encoding='utf-8')
          print(f'Updated athletics navigation. brand={brand_count}, utility={utility_count}, main={main_count}')
          PY

      - name: Commit athletics-only navigation
        shell: bash
        run: |
          rm -f .github/workflows/lock-athletics-navigation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html .github/workflows/lock-athletics-navigation-once.yml
          git commit -m "Restrict public navigation to athletics"
          git push
