name: Lock athletics navigation once

on:
  push:
    paths:
      - '.github/workflows/lock-athletics-navigation-once.yml'

permissions:
  contents: write

jobs:
  lock-athletics-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restrict public navigation to athletics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Keep school branding, but keep the logo inside Athletics.
          html = html.replace('<a class="brand" href="index.html">', '<a class="brand" href="athletics.html">', 1)

          # Replace the utility links with one athletics-only link.
          html, utility_count = re.subn(
              r'<div\s+class=["\']topbar-links["\']>.*?</div>',
              '<div class="topbar-links"><a href="athletics.html" aria-current="page">Athletics Portal</a></div>',
              html,
              count=1,
              flags=re.I | re.S,
          )

          # Inject a small athletics-only guard. This hides unfinished main/footer links and
          # rewrites any remaining same-site general-page links back to Athletics.
          guard_style = '''
<style id="athletics-only-nav-guard">
.header .nav a:not([href="athletics.html"]),
.header nav a:not([href="athletics.html"]),
.footer a[href$=".html"]:not([href="athletics.html"]):not([href^="athletics-portal/"]),
.crumb a[href="index.html"]{display:none!important}
</style>
'''
          guard_script = '''
<script id="athletics-only-link-guard">
(function(){
  const allowed = href => {
    if (!href) return true;
    if (/^(https?:|mailto:|tel:|#)/i.test(href)) return true;
    return href === 'athletics.html' || href.startsWith('athletics-portal/');
  };
  document.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (!allowed(href) && /\.html(?:$|[?#])/i.test(href)) {
      a.setAttribute('href','athletics.html');
    }
  });
})();
</script>
'''
          if 'athletics-only-nav-guard' not in html:
              html = html.replace('</head>', guard_style + '</head>', 1)
          if 'athletics-only-link-guard' not in html:
              html = html.replace('</body>', guard_script + '</body>', 1)

          # Breadcrumb becomes a simple label instead of a Home escape route.
          html = re.sub(
              r'<div\s+class=["\']crumb["\']>\s*<a\s+href=["\']index\.html["\']>Home</a>\s*<span>\s*/\s*</span>\s*<span>Eagles Athletics</span>\s*</div>',
              '<div class="crumb"><span>Eagles Athletics</span></div>',
              html,
              count=1,
              flags=re.I | re.S,
          )

          if utility_count != 1:
              raise SystemExit(f'Expected one utility navigation block; found {utility_count}.')
          if html == original:
              raise SystemExit('No changes were made.')

          path.write_text(html, encoding='utf-8')
          print('Athletics-only navigation guard installed.')
          PY

      - name: Commit athletics-only navigation
        shell: bash
        run: |
          rm -f .github/workflows/lock-athletics-navigation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html .github/workflows/lock-athletics-navigation-once.yml
          git commit -m "Restrict public navigation to athletics"
          git push
