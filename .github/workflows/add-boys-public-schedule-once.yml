name: Add boys public schedule once
on:
  push:
    paths:
      - '.github/workflows/add-boys-public-schedule-once.yml'
permissions:
  contents: write
jobs:
  add-boys-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add boys volleyball schedule to public team tab
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('athletics-portal/teams/shared/team-data.js')
          s = p.read_text()
          old = "    practice: [],\n    games: []\n  },\n  coedFlagFootball: {"
          new = "    practice: [],\n    games: [\n      { date: 'Oct 19', time: '', opponent: 'Empower College Prep', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: 'TBA' },\n      { date: 'Oct 21', time: '', opponent: 'Adams Traditional Academy', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA' },\n      { date: 'Oct 26', time: '', opponent: 'Academy of Math and Science Flower', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: 'TBA' },\n      { date: 'Oct 28', time: '', opponent: 'Imagine at Cortez Park', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA' },\n      { date: 'Nov 2', time: '', opponent: 'Pensar Academy', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: 'TBA' },\n      { date: 'Nov 4', time: '', opponent: 'Freedom Academy', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: 'TBA' },\n      { date: 'Nov 9', time: '', opponent: 'Hearn Academy', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: 'TBA' },\n      { date: 'Nov 11', time: '', opponent: 'ALA West Foothills Team 2', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA', detail: 'Required Non-Region • Does Not Count Toward Regional Standings' },\n      { date: 'Nov 18', time: '', opponent: 'Liberty Traditional School', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA' },\n      { date: 'Dec 1', time: '', opponent: 'Stepping Stones Academy', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA' }\n    ]\n  },\n  coedFlagFootball: {"
          if old not in s:
              raise SystemExit('boys schedule marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-boys-public-schedule-once.yml
          git add athletics-portal/teams/shared/team-data.js
          git commit -m "Add boys volleyball schedule to team page"
          git push
