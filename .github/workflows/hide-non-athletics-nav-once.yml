name: Hide non-athletics navigation once

on:
  push:
    paths:
      - '.github/workflows/hide-non-athletics-nav-once.yml'

permissions:
  contents: write

jobs:
  hide-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide unfinished navigation links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('athletics.html')
          html = path.read_text(encoding='utf-8')
          marker = 'athletics-visual-nav-lock-v2'
          css = '''\n<style id="athletics-visual-nav-lock-v2">\n/* Public launch lock: only Athletics stays visible in the school header. */\n.header .nav a,\n.header nav a { display:none !important; }\n.header .nav a[href="athletics.html"],\n.header .nav a.active,\n.header nav a[href="athletics.html"],\n.header nav a.active { display:inline-flex !important; }\n.crumb a { display:none !important; }\n</style>\n'''
          if marker not in html:
              html = html.replace('</head>', css + '</head>', 1)
          else:
              raise SystemExit('Visual navigation lock already present.')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/hide-non-athletics-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics.html .github/workflows/hide-non-athletics-nav-once.yml
          git commit -m "Hide unfinished navigation from athletics page"
          git push
