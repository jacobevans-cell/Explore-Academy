name: Add boys to banquet once
on:
  push:
    paths:
      - '.github/workflows/add-boys-banquet-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add boys to volleyball banquet
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('athletics-portal/teams/shared/team-data.js')
          s=p.read_text()
          s=s.replace("subtitle: 'JV + Varsity Girls Volleyball • Season Celebration'", "subtitle: 'JV Girls + Varsity Girls + Boys Volleyball • Season Celebration'")
          boys_marker="""      { date: 'Dec 1', time: '', opponent: 'Stepping Stones Academy', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA' }\n    ]\n  },"""
          boys_repl="""      { date: 'Dec 1', time: '', opponent: 'Stepping Stones Academy', location: 'Home', address: '17667 N 91st Ave, Peoria, AZ 85382', drive: 'On campus', leave: '—', arrival: 'TBA' }\n    ],\n    events: [\n      {\n        type: 'banquet',\n        date: 'Nov 20',\n        time: '5:00–7:30 PM',\n        title: 'End-of-Season Volleyball Banquet',\n        subtitle: 'JV Girls + Varsity Girls + Boys Volleyball • Season Celebration',\n        location: 'TBA',\n        items: [\n          { icon: '👗', title: 'Fancy Dress', detail: 'All volleyball players, including Boys Volleyball, dress up for the celebration' },\n          { icon: '🍽️', title: 'Potluck Food', detail: 'Families bring food to share' },\n          { icon: '📸', title: 'Media Day Pictures', detail: 'Player and team photos' }\n        ]\n      }\n    ]\n  },"""
          if boys_marker not in s:
              raise SystemExit('boys games marker not found')
          s=s.replace(boys_marker,boys_repl,1)
          s=s.replace("{ icon: '👗', title: 'Fancy Dress', detail: 'Dress up for the celebration' }", "{ icon: '👗', title: 'Fancy Dress', detail: 'All volleyball players dress up for the celebration' }")
          p.write_text(s)

          p=Path('athletics-portal/teams/shared/team-page.js')
          s=p.read_text()
          s=s.replace("event.subtitle||'JV + Varsity Girls Volleyball'", "event.subtitle||'JV Girls + Varsity Girls + Boys Volleyball'")
          s=s.replace('<span class="team-events-badge">JV + VARS</span>', '<span class="team-events-badge">JV + VARS + BOYS</span>')
          p.write_text(s)
          PY
      - name: Commit banquet update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-boys-banquet-once.yml
          git add athletics-portal/teams/shared/team-data.js athletics-portal/teams/shared/team-page.js
          git commit -m "Add Boys Volleyball to season banquet"
          git push