name: Fix banquet attire icon once
on:
  push:
    paths:
      - '.github/workflows/fix-banquet-attire-icon-once.yml'
permissions:
  contents: write
jobs:
  fix-banquet-attire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dress-specific banquet icon and wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('athletics-portal/teams/shared/team-data.js')
          s=p.read_text()
          s=s.replace("{ icon: '👗', title: 'Fancy Dress', detail: 'All volleyball players dress up for the celebration' }","{ icon: '✨', title: 'Formal Attire', detail: 'All volleyball players dress up for the celebration' }")
          s=s.replace("{ icon: '👗', title: 'Fancy Dress', detail: 'All volleyball players, including Boys Volleyball, dress up for the celebration' }","{ icon: '✨', title: 'Formal Attire', detail: 'All volleyball players dress up for the celebration' }")
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-banquet-attire-icon-once.yml
          git add athletics-portal/teams/shared/team-data.js
          git commit -m "Make banquet attire presentation gender-neutral"
          git push
