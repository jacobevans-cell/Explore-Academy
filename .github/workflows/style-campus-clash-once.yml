name: Style Campus Clash once

on:
  push:
    paths:
      - '.github/workflows/style-campus-clash-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Campus Clash styling
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('athletics-portal/teams/shared/team-page.js')
          css_path = Path('athletics-portal/teams/shared/team-pages.css')

          js = js_path.read_text()
          old = "const specialClass=detail.includes('pink out')?' pink-out':detail.includes('glow in the dark')?' glow-game':'';"
          new = "const specialClass=detail.includes('pink out')?' pink-out':detail.includes('glow in the dark')?' glow-game':detail.includes('staff vs students')?' campus-clash':'';"
          if old not in js:
              raise SystemExit('Could not find specialClass target')
          js = js.replace(old, new, 1)
          js_path.write_text(js)

          css = css_path.read_text()
          anchor = ".pink-out{position:relative;border:4px solid #f20f8d!important;"
          campus = ".campus-clash{position:relative;border:4px solid #f3c64d!important;background:linear-gradient(135deg,#081f3f 0,#123d72 48%,#0d2d57 100%)!important;box-shadow:0 18px 42px rgba(8,31,63,.28)!important;overflow:hidden}.campus-clash:before{content:'🏫 CAMPUS CLASH';display:block;background:linear-gradient(90deg,#f6d56a,#f0b82f);color:#0a2b54;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:950;letter-spacing:.05em;text-align:center;box-shadow:0 8px 20px rgba(240,184,47,.28)}.campus-clash:after{content:'✦';position:absolute;right:16px;top:72px;color:#ffe17f;font-size:34px;opacity:.28;transform:rotate(12deg)}.campus-clash .card-title,.campus-clash .game-opponent{color:#0a2b54}.campus-clash .event-badge{background:linear-gradient(90deg,#fff1a8,#ffd45f);color:#17365f;border:2px solid #e2ae27;font-size:12px;white-space:normal}.campus-clash .travel-plan{background:linear-gradient(145deg,#092b52,#174d88 58%,#0c345f);border-color:#f3c64d;box-shadow:0 12px 28px rgba(8,31,63,.25)}.campus-clash .travel-venue{background:rgba(255,255,255,.14);border-color:rgba(255,225,127,.45)}.campus-clash .travel-stats>div{box-shadow:inset 0 0 0 2px #ffe17f}.campus-clash .maps-button{color:#0a2b54;border:2px solid #f3c64d;background:#fff9dc}.campus-clash .maps-button:hover{background:#fff2b3}"
          if anchor not in css:
              raise SystemExit('Could not find CSS anchor')
          css = css.replace(anchor, campus + anchor, 1)
          css_path.write_text(css)
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/style-campus-clash-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/team-pages.css .github/workflows/style-campus-clash-once.yml
          git commit -m "Style JV Staff vs Students as Campus Clash"
          git push