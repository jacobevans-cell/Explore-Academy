name: Rebalance banquet design once
on:
  push:
    paths:
      - '.github/workflows/rebalance-banquet-design-once.yml'
permissions:
  contents: write
jobs:
  rebalance-banquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make banquet design coed and team-neutral
        run: |
          python - <<'PY'
          from pathlib import Path

          cssp=Path('athletics-portal/teams/shared/team-pages.css')
          css=cssp.read_text()
          marker='/* COED BANQUET REBALANCE */'
          block=r'''
/* COED BANQUET REBALANCE */
.team-event-card.banquet-card{background:linear-gradient(135deg,#082b5b 0%,#0f4d8f 22%,#f3f6f9 22%,#ffffff 66%,#132f52 66%,#071d39 100%)!important;border:4px solid #0b4ea2!important;box-shadow:0 20px 46px rgba(7,29,57,.22)!important;color:#0a2b54!important}
.banquet-kicker{color:#0a2b54!important;letter-spacing:.14em!important}
.banquet-title{background:linear-gradient(180deg,#0d376c 0%,#0a2b54 48%,#061a35 52%,#0d376c 100%)!important;color:#fff!important;border-color:#d7e0e8!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 9px 20px rgba(7,29,57,.24)!important;text-shadow:0 2px 1px rgba(0,0,0,.25)!important}
.banquet-subtitle{color:#0a2b54!important;font-weight:950!important}
.banquet-date,.banquet-time{background:linear-gradient(180deg,#fff 0%,#edf2f7 48%,#dce5ed 100%)!important;border-color:#9fb3c6!important;color:#0a2b54!important}
.banquet-feature{background:#fff!important;border:2px solid #a9b9c8!important;color:#0a2b54!important;box-shadow:0 8px 16px rgba(7,29,57,.08)!important}
.banquet-feature-1{background:linear-gradient(135deg,#0a2b54,#154f88)!important;color:#fff!important;border-color:#7e9ab4!important}
.banquet-feature-2{background:linear-gradient(135deg,#eef3f7,#fff)!important}
.banquet-feature-3{background:linear-gradient(135deg,#163d66,#0c2a49)!important;color:#fff!important;border-color:#8aa3ba!important}
.banquet-feature-icon{filter:none!important}
.banquet-location{background:linear-gradient(90deg,#0a2b54,#123f70)!important;color:#fff!important;border-color:#95aabd!important}
.banquet-footer{background:linear-gradient(90deg,#eef3f7,#fff,#eef3f7)!important;color:#0a2b54!important;border-color:#8fa7bc!important}
.team-events-badge{background:linear-gradient(180deg,#f9fbfd,#cfd9e2)!important;color:#0a2b54!important;border:2px solid #8299ad!important;box-shadow:0 4px 10px rgba(7,29,57,.14)!important}
'''
          if marker not in css:
              css += block
          cssp.write_text(css)

          jsp=Path('athletics-portal/teams/shared/team-page.js')
          js=jsp.read_text()
          js=js.replace("<div class=\"banquet-kicker\">✨ FORMAL SEASON CELEBRATION ✨</div>","<div class=\"banquet-kicker\">🏐 VOLLEYBALL SEASON CELEBRATION 🏐</div>")
          js=js.replace("❤️ Celebrate the season • 📸 Capture the memories • 🏐 One volleyball family","🏐 JV Girls • Varsity Girls • Boys Volleyball • One program")
          jsp.write_text(js)
          PY
      - name: Commit banquet redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebalance-banquet-design-once.yml
          git add athletics-portal/teams/shared/team-pages.css athletics-portal/teams/shared/team-page.js
          git commit -m "Rebalance banquet design for all volleyball teams"
          git push
