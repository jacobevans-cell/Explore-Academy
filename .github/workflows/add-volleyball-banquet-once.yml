name: Add volleyball banquet once

on:
  push:
    paths:
      - '.github/workflows/add-volleyball-banquet-once.yml'

permissions:
  contents: write

jobs:
  update-banquet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Explore Academy
        uses: actions/checkout@v4

      - name: Apply banquet patch
        run: python .github/scripts/add_volleyball_banquet_once.py

      - name: Commit banquet updates
        run: |
          rm .github/workflows/add-volleyball-banquet-once.yml
          rm .github/scripts/add_volleyball_banquet_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics-portal/teams/shared/team-data.js athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/team-pages.css athletics-portal/teams/jv-girls-volleyball.html athletics-portal/teams/varsity-girls-volleyball.html .github/workflows/add-volleyball-banquet-once.yml .github/scripts/add_volleyball_banquet_once.py
          git commit -m "Add JV and Varsity end-of-season banquet"
          git push
