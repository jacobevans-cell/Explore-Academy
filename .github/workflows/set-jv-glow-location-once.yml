name: Set JV glow location once
on:
  push:
    paths:
      - '.github/workflows/set-jv-glow-location-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Sequoia glow game location
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('athletics-portal/teams/shared/team-data.js')
          s=p.read_text()
          old="      { date: 'Sep 24', time: '5:45 PM', opponent: 'Sequoia Pathfinder', arrival: '5:15 PM', detail: '✨ GLOW IN THE DARK GAME • Fun Game • Ends 7:45 PM' }"
          new="      { date: 'Sep 24', time: '5:45 PM', opponent: 'Sequoia Pathfinder Verrado', location: 'Away', drive: 'Live route', leave: 'TBA', arrival: '5:15 PM', detail: '✨ GLOW IN THE DARK GAME • Fun Game • Ends 7:45 PM • At Sequoia Pathfinder' }"
          if old not in s:
              raise SystemExit('Glow game entry not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/set-jv-glow-location-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add athletics-portal/teams/shared/team-data.js .github/workflows/set-jv-glow-location-once.yml
          git commit -m 'Set JV Glow Game at Sequoia Pathfinder'
          git push
