name: Formal attire icons once
on:
  push:
    paths:
      - '.github/workflows/formal-attire-icons-once.yml'
permissions:
  contents: write
jobs:
  formal-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use both formal clothing icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('athletics-portal/teams/shared/team-data.js')
          s=p.read_text()
          old="{ icon: '✨', title: 'Formal Attire', detail: 'All volleyball players dress up for the celebration' }"
          new="{ icon: '🤵 👗', title: 'Formal Attire', detail: 'All volleyball players dress up for the celebration' }"
          count=s.count(old)
          if count!=3:
              raise SystemExit(f'expected 3 formal attire items, found {count}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/formal-attire-icons-once.yml
          git add athletics-portal/teams/shared/team-data.js
          git commit -m "Show boys and girls formal attire icons"
          git push
