name: Fix Glow admin card once
on:
  push:
    paths:
      - '.github/workflows/fix-glow-admin-card-once.yml'
permissions:
  contents: write
jobs:
  fix-glow-admin-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Glow Game card details and styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('athletics-portal/admin-calendar.html')
          s = p.read_text()
          bad = '.game-card.pink-out .game-card.glow-game{'
          good = '.game-card.glow-game{'
          if bad not in s:
              raise SystemExit('broken glow selector not found')
          s = s.replace(bad, good, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-glow-admin-card-once.yml
          git add athletics-portal/admin-calendar.html
          git commit -m "Restore Glow Game details in admin calendar"
          git push
