name: Sort rosters by first name once

on:
  push:
    paths:
      - '.github/workflows/sort-rosters-by-first-name-once.yml'

permissions:
  contents: write

jobs:
  sort-rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make roster display sort by first name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('athletics-portal/teams/shared/team-page.js')
          text = path.read_text(encoding='utf-8')
          old = "function roster(team){return(team.roster||[]).map("
          new = "function roster(team){return [...(team.roster||[])].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'})).map("
          if old not in text:
              raise SystemExit('Roster renderer target not found; refusing blind edit.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit roster sort behavior
        shell: bash
        run: |
          rm -f .github/workflows/sort-rosters-by-first-name-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics-portal/teams/shared/team-page.js .github/workflows/sort-rosters-by-first-name-once.yml
          git commit -m "Sort team rosters alphabetically by first name"
          git push
