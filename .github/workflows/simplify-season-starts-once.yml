name: Simplify season starts once

on:
  push:
    paths:
      - '.github/workflows/simplify-season-starts-once.yml'

permissions:
  contents: write

jobs:
  simplify-season-starts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Boys and Flag practice starts the actual season starts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          data_path = Path('athletics-portal/teams/shared/team-data.js')
          data = data_path.read_text(encoding='utf-8')

          old_boys = """      start: '2026-10-14',\n      practiceStart: '2026-09-28',\n      end: '2026-12-04',\n      display: 'October 14 – December 4, 2026'"""
          new_boys = """      start: '2026-09-28',\n      end: '2026-12-04',\n      display: 'September 28 – December 4, 2026'"""
          if old_boys not in data:
              raise SystemExit('Expected Boys season block not found')
          data = data.replace(old_boys, new_boys, 1)

          old_flag = """      start: '2026-09-21',\n      practiceStart: '2026-09-14',\n      end: '2026-11-19',\n      display: 'September 21 – November 19, 2026'"""
          new_flag = """      start: '2026-09-14',\n      end: '2026-11-19',\n      display: 'September 14 – November 19, 2026'"""
          if old_flag not in data:
              raise SystemExit('Expected Flag Football season block not found')
          data = data.replace(old_flag, new_flag, 1)
          data_path.write_text(data, encoding='utf-8')

          page_path = Path('athletics-portal/teams/shared/team-page.js')
          page = page_path.read_text(encoding='utf-8')

          practice_window_fn = """function teamIsInPracticeWindow(team,date){\n  if(!team.season)return true;\n  const check=new Date(date);check.setHours(12,0,0,0);\n  const start=parseSeasonDate(team.season.practiceStart||team.season.start);\n  const end=parseSeasonDate(team.season.end,true);\n  if(start&&check<start)return false;\n  if(end&&check>end)return false;\n  return true;\n}\n"""
          if practice_window_fn not in page:
              raise SystemExit('Expected practice window helper not found')
          page = page.replace(practice_window_fn, '', 1)
          page = page.replace('!teamIsInPracticeWindow(team,date)', '!teamIsInSeason(team,date)')
          page = page.replace('if(!teamIsInPracticeWindow(team,date))return outOfSeasonCard(team,day,date);', 'if(!teamIsInSeason(team,date))return outOfSeasonCard(team,day,date);')
          page = page.replace("const message=before?`Practices begin ${team.season?.practiceStart||team.season?.start||''}`:'Season has ended';", "const message=before?`Season begins ${team.season?.display||team.season?.start||''}`:'Season has ended';")
          page_path.write_text(page, encoding='utf-8')
          PY

      - name: Commit simplified season starts
        shell: bash
        run: |
          rm -f .github/workflows/simplify-season-starts-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics-portal/teams/shared/team-data.js athletics-portal/teams/shared/team-page.js .github/workflows/simplify-season-starts-once.yml
          git commit -m "Use direct season starts for Boys and Flag Football"
          git push
