name: Force banquet visible once

on:
  push:
    paths:
      - '.github/workflows/force-banquet-visible-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force banquet rendering for JV and Varsity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('athletics-portal/teams/shared/team-page.js')
          css_path = Path('athletics-portal/teams/shared/team-pages.css')
          pages = [
              Path('athletics-portal/teams/jv-girls-volleyball.html'),
              Path('athletics-portal/teams/varsity-girls-volleyball.html'),
          ]

          js = js_path.read_text()
          css = css_path.read_text()

          anchor = "const VOLLEYBALL_TEAM_IDS = ['jv-girls-volleyball','varsity-girls-volleyball','boys-volleyball'];"
          insert = """const VOLLEYBALL_TEAM_IDS = ['jv-girls-volleyball','varsity-girls-volleyball','boys-volleyball'];
const BANQUET_TEAM_IDS = new Set(['jv-girls-volleyball','varsity-girls-volleyball']);
const JOINT_VOLLEYBALL_BANQUET = {
  type: 'banquet',
  date: 'Nov 20',
  time: '5:00–7:30 PM',
  title: 'End-of-Season Volleyball Banquet',
  subtitle: 'JV + Varsity Girls Volleyball • Season Celebration',
  location: 'TBA',
  items: [
    { icon: '👗', title: 'Fancy Dress', detail: 'Dress up for the celebration' },
    { icon: '🍽️', title: 'Potluck Food', detail: 'Families bring food to share' },
    { icon: '📸', title: 'Media Day Pictures', detail: 'Player and team photos' }
  ]
};
function teamHasBanquet(team){return Boolean(team&&BANQUET_TEAM_IDS.has(team.id));}
"""
          if 'const BANQUET_TEAM_IDS' not in js:
              if anchor not in js:
                  raise SystemExit('volleyball team anchor missing')
              js = js.replace(anchor, insert, 1)

          old_team_events = """function teamEvents(team){
  if(!team.events?.length)return'';
  return `<section class=\"section team-events\" id=\"events\"><div class=\"team-events-head\"><div><div class=\"kicker\">Special Team Event</div><h2>Season Celebration</h2></div><span class=\"team-events-badge\">JV + VARS</span></div>${team.events.map(eventCard).join('')}</section>`;
}"""
          new_team_events = """function teamEvents(team){
  if(!teamHasBanquet(team))return'';
  return `<section class=\"section team-events\" id=\"events\"><div class=\"team-events-head\"><div><div class=\"kicker\">Special Team Event</div><h2>Season Celebration</h2></div><span class=\"team-events-badge\">JV + VARS</span></div>${eventCard(JOINT_VOLLEYBALL_BANQUET)}</section>`;
}
function banquetNotice(team){
  if(!teamHasBanquet(team))return'';
  return `<a class=\"banquet-notice\" href=\"#events\" aria-label=\"View end-of-season volleyball banquet details\"><span class=\"banquet-notice-icon\">🏆</span><span class=\"banquet-notice-copy\"><small>JV + VARSITY • SPECIAL EVENT</small><strong>END-OF-SEASON VOLLEYBALL BANQUET</strong><em>Friday, Nov. 20 • 5:00–7:30 PM • Fancy Dress • Potluck • Media Day Pictures</em></span><span class=\"banquet-notice-arrow\">VIEW DETAILS ↓</span></a>`;
}"""
          if old_team_events in js:
              js = js.replace(old_team_events, new_team_events, 1)
          elif 'function banquetNotice(team)' not in js:
              raise SystemExit('teamEvents block missing')

          js = js.replace("${team.events?.length?'<a href=\"#events\">Banquet</a>':''}", "${teamHasBanquet(team)?'<a href=\"#events\">Banquet</a>':''}")

          old_closed = '<section class="season-gate closed"><div class="season-gate-icon">🏁</div><div class="kicker">${esc(team.title)}</div><h1>Season Closed</h1><p>The 2026 ${esc(team.title)} season has ended.</p><div class="season-gate-dates">${seasonDetails(team)}</div></section>${teamEvents(team)}'
          new_closed = '<section class="season-gate closed"><div class="season-gate-icon">🏁</div><div class="kicker">${esc(team.title)}</div><h1>Season Closed</h1><p>The 2026 ${esc(team.title)} season has ended.</p><div class="season-gate-dates">${seasonDetails(team)}</div></section>${banquetNotice(team)}${teamEvents(team)}'
          if old_closed in js:
              js = js.replace(old_closed, new_closed, 1)

          old_main = '<div class="wrap">${seasonBanner}<section class="hero">'
          new_main = '<div class="wrap">${seasonBanner}${banquetNotice(team)}<section class="hero">'
          if old_main in js:
              js = js.replace(old_main, new_main, 1)
          elif '${seasonBanner}${banquetNotice(team)}<section class="hero">' not in js:
              raise SystemExit('main render anchor missing')

          js = js.replace('./team-data.js?v=20260910-banquet1', './team-data.js?v=20260910-banquet2')
          js_path.write_text(js)

          notice_css = r'''

/* Always-visible JV + Varsity banquet announcement */
.banquet-notice{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;margin:22px 0 4px;padding:16px 18px;border-radius:20px;text-decoration:none;background:linear-gradient(105deg,#9f071d 0,#e51f3d 19%,#f7f9fc 19.5%,#fff 50%,#e7ecf2 67%,#1265b0 67.5%,#073b75 100%);border:3px solid #0a2b54;box-shadow:0 14px 30px rgba(7,42,82,.2),inset 0 0 0 2px rgba(255,255,255,.8)}
.banquet-notice:after{content:'';position:absolute;inset:-70% -30%;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.7) 49%,rgba(255,255,255,.12) 53%,transparent 61%);transform:translateX(-43%) rotate(4deg);opacity:.7}.banquet-notice>*{position:relative;z-index:1}.banquet-notice-icon{display:grid;place-items:center;flex:0 0 54px;width:54px;height:54px;border-radius:16px;background:linear-gradient(180deg,#fff,#d8e0e8 45%,#fff 51%,#aebbc8);border:2px solid #fff;font-size:30px;box-shadow:0 7px 16px rgba(74,0,12,.22)}.banquet-notice-copy{display:grid;gap:2px;min-width:0;flex:1}.banquet-notice-copy small{color:#b10b26;font-size:9px;font-weight:1000;letter-spacing:.13em}.banquet-notice-copy strong{color:#092d5b;font-size:clamp(16px,2.2vw,23px);font-weight:1000;letter-spacing:.015em}.banquet-notice-copy em{color:#34495f;font-size:11px;font-style:normal;font-weight:850}.banquet-notice-arrow{flex:0 0 auto;padding:9px 11px;border-radius:999px;background:#0a2b54;color:#fff;font-size:9px;font-weight:1000;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}.banquet-notice:hover{transform:translateY(-1px);box-shadow:0 17px 34px rgba(7,42,82,.24),inset 0 0 0 2px rgba(255,255,255,.9)}
@media(max-width:700px){.banquet-notice{align-items:flex-start;gap:10px;padding:13px}.banquet-notice-icon{flex-basis:44px;width:44px;height:44px;font-size:24px}.banquet-notice-arrow{display:none}.banquet-notice-copy small{color:#7f0618}.banquet-notice-copy strong{font-size:15px}.banquet-notice-copy em{font-size:10px;line-height:1.35}}
'''
          if '/* Always-visible JV + Varsity banquet announcement */' not in css:
              css += notice_css
          css_path.write_text(css)

          for page in pages:
              html = page.read_text()
              html = re.sub(r'team-pages\.css\?v=[^\"]+', 'team-pages.css?v=20260910-banquet2', html)
              html = re.sub(r'team-page\.js\?v=[^\"]+', 'team-page.js?v=20260910-banquet2', html)
              page.write_text(html)
          PY

          cp athletics-portal/teams/shared/team-data.js /tmp/team-data.mjs
          cp athletics-portal/teams/shared/team-page.js /tmp/team-page.mjs
          node --check /tmp/team-data.mjs
          node --check /tmp/team-page.mjs
          grep -q 'END-OF-SEASON VOLLEYBALL BANQUET' athletics-portal/teams/shared/team-page.js
          grep -q 'team-pages.css?v=20260910-banquet2' athletics-portal/teams/jv-girls-volleyball.html
          grep -q 'team-pages.css?v=20260910-banquet2' athletics-portal/teams/varsity-girls-volleyball.html

          rm .github/workflows/force-banquet-visible-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athletics-portal/teams/shared/team-page.js athletics-portal/teams/shared/team-pages.css athletics-portal/teams/jv-girls-volleyball.html athletics-portal/teams/varsity-girls-volleyball.html .github/workflows/force-banquet-visible-once.yml
          git commit -m "Force banquet visible on JV and Varsity pages"
          git push
