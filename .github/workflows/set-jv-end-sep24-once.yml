name: Set JV end date Sep 24 once
on:
  push:
    paths:
      - '.github/workflows/set-jv-end-sep24-once.yml'
permissions:
  contents: write
jobs:
  set-jv-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set JV season end to September 24
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('athletics-portal/teams/shared/team-data.js')
          s = p.read_text()
          old = "      end: '2026-09-25',\n      display: 'August 11 – September 25, 2026'"
          new = "      end: '2026-09-24',\n      display: 'August 11 – September 24, 2026'"
          if old not in s:
              raise SystemExit('JV season date marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/set-jv-end-sep24-once.yml
          git add athletics-portal/teams/shared/team-data.js
          git commit -m "End JV volleyball season on Sep 24"
          git push
