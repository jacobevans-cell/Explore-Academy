<!doctype html><html lang="en"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boys Volleyball | Explore Academy</title><link rel="stylesheet" href="shared/team-pages.css?v=20261119-thanksgiving-break"><link rel="stylesheet" href="shared/practice-week.css?v=20260904-3"></head><body data-team-id="boys-volleyball"><script type="module" src="shared/team-page.js?v=20261119-hearn-force-v3"></script><script data-hearn-fallback>
(function(){
  function fixHearnCard(){
    var cards=[].slice.call(document.querySelectorAll('.practice-card'));
    var tue=cards.find(function(card){
      var title=card.querySelector('.card-title');
      var date=card.querySelector('.practice-date');
      return title && /Tuesday/i.test(title.textContent||'') && date && /Nov 24/i.test(date.textContent||'');
    });
    if(!tue) return false;
    tue.className='card practice-card practice-conflict';
    tue.innerHTML='<div class="practice-day-row"><div><div class="card-title">Tuesday</div><div class="practice-date">Nov 24</div></div><span class="practice-status conflict">GAME DAY</span></div><div class="practice-cancel">🏐 BOYS VOLLEYBALL</div><div class="practice-reason">4:30–5:30 PM • vs. Hearn Academy</div><div class="practice-note">Thanksgiving Break • No school practice today. Confirmed game remains scheduled.</div>';
    return true;
  }
  var attempts=0;
  var timer=setInterval(function(){
    attempts++;
    if(fixHearnCard() || attempts>40) clearInterval(timer);
  },100);
})();
</script></body></html>
