<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Athletics Sign In</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><img src="assets/explore-mark.svg" alt=""><h1>Explore Athletics</h1><p>Athlete & family account</p></div><div id="status" class="status"></div><form id="loginForm" class="fields" style="grid-template-columns:1fr"><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-navy" type="submit">Sign In</button></form><div class="grid" style="gap:8px;margin-top:10px"><button id="googleBtn" class="btn btn-secondary">Continue with Google</button><button id="createBtn" class="btn btn-secondary">Create Athlete / Family Account</button><button id="resetBtn" class="btn btn-secondary">Reset Password</button></div><p style="font-size:12px;text-align:center;margin:18px 0 0;color:var(--muted)">New accounts must verify their email address before athlete records can be opened.</p></section></main><script type="module" src="js/login.js"></script></body></html>
