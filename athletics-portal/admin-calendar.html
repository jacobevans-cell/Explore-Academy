<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Athletics Admin Calendar | Explore Academy</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .calendar-shell{max-width:1360px;margin:auto;padding:26px}.calendar-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}.calendar-head h1{margin:0;color:var(--navy);letter-spacing:-.045em;font-size:clamp(34px,5vw,58px)}.calendar-head p{margin:8px 0 0;color:var(--muted);font-weight:700}.calendar-actions,.view-actions,.month-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .calendar-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 20px}.calendar-metrics .card{position:relative;overflow:hidden}.calendar-metrics .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#176fc2,#55b9f3)}
    .team-key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0 28px}.team-key-card{--team:#176fc2;position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--team),color-mix(in srgb,var(--team) 72%,#091f3e));box-shadow:0 12px 28px color-mix(in srgb,var(--team) 18%,transparent)}.team-key-card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.09);right:-30px;top:-35px}.team-key-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:25px;margin-bottom:16px}.team-key-name{font-size:18px;font-weight:950}.team-key-sub{font-size:11px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;opacity:.82;margin-top:3px}.team-key-count{font-size:28px;font-weight:950;margin-top:14px}.team-key-count small{font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.8;margin-left:4px}.team-key-card.jv{--team:#176fc2}.team-key-card.varsity{--team:#d12c3f}.team-key-card.boys{--team:#6c3fb5}.team-key-card.flag{--team:#168a57}
    .calendar-section{margin-top:24px}.calendar-section h2{margin:0;color:var(--navy);font-size:26px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 14px}.view-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:11px 16px;font-weight:950;cursor:pointer}.view-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 8px 18px rgba(8,45,92,.16)}
    .month-group{margin:12px 0 18px}.month-group-title{display:flex;align-items:center;gap:10px;margin-bottom:7px;color:var(--navy);font-size:18px;font-weight:950}.month-group-title:after{content:"";height:2px;background:linear-gradient(90deg,#d8e4ef,transparent);flex:1}
    .game-card{--team:#176fc2;display:grid;grid-template-columns:58px 30px minmax(0,1fr);gap:9px;align-items:center;background:#fff;border:1px solid #dce5ef;border-left:5px solid var(--team);border-radius:12px;padding:7px 10px;margin:5px 0;box-shadow:0 4px 12px rgba(8,45,92,.04);min-height:66px}.game-card:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(8,45,92,.07)}.game-card.jv{--team:#176fc2}.game-card.varsity{--team:#d12c3f}.game-card.boys{--team:#6c3fb5}.game-card.flag{--team:#168a57}.game-card.conflict{outline:2px solid #ffc6cc;background:#fff8f8}
    .date-block{border-radius:9px;background:color-mix(in srgb,var(--team) 10%,white);padding:5px 4px;text-align:center;color:var(--team);align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-height:52px}.date-block .month{font-size:7px;font-weight:950;letter-spacing:.07em;text-transform:uppercase}.date-block .day{font-size:18px;line-height:1;font-weight:950;margin:2px 0;min-height:0!important;padding:0!important;border:0!important;background:transparent!important}.date-block .time{font-size:8px;font-weight:900}.sport-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--team) 12%,white);font-size:16px;border:1px solid color-mix(in srgb,var(--team) 25%,white)}
    .identity-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.sport-badge,.team-badge{display:inline-flex;align-items:center;padding:3px 6px;border-radius:999px;font-size:7px;font-weight:950;letter-spacing:.05em;text-transform:uppercase}.sport-badge{background:#eef3f8;color:#425873}.team-badge{background:color-mix(in srgb,var(--team) 12%,white);color:var(--team);border:1px solid color-mix(in srgb,var(--team) 28%,white)}.game-mainline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}.game-team{font-size:14px;font-weight:950;color:var(--navy)}.game-opponent{font-size:13px;font-weight:850;color:var(--ink)}.game-meta{font-size:9px;color:var(--muted);font-weight:700;margin-top:2px}.game-status{display:none}
    .past-games{margin-top:16px;border:1px solid #d7e3ee;border-radius:14px;background:#fff;overflow:hidden}.past-games summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:950;color:var(--navy);background:#f5f9fd;display:flex;justify-content:space-between;align-items:center}.past-games summary::-webkit-details-marker{display:none}.past-games summary:after{content:'▾';font-size:16px}.past-games[open] summary:after{content:'▴'}.past-games-body{padding:6px 10px 10px}.past-games .month-group{margin:8px 0 12px}.past-games .game-card{opacity:.88}
    .conflict-box{border-left:6px solid var(--danger);background:#fff4f5}.conflict-box strong{color:var(--danger)}.empty{color:var(--muted);padding:18px 0}.hidden{display:none!important}
    .month-title{font-size:20px;font-weight:950;color:var(--navy);min-width:180px;text-align:center}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(8,45,92,.06)}.dow{padding:11px;background:#0b315f;color:#fff;text-transform:uppercase;letter-spacing:.07em;font-size:10px;font-weight:950;border-right:1px solid rgba(255,255,255,.16)}.dow:nth-child(7){border-right:0}.day{min-height:155px;padding:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff}.day:nth-child(7n){border-right:0}.day.outside{background:#f7f9fc}.day-number{font-size:12px;font-weight:950;color:var(--navy);margin-bottom:8px}.day.outside .day-number{color:#aab4c0}.month-event{--team:#176fc2;display:block;margin:6px 0 0;padding:8px;border-radius:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--team) 13%,white),#fff);color:var(--team);border-left:5px solid var(--team);font-size:10px;font-weight:850;line-height:1.25}.month-event.jv{--team:#176fc2}.month-event.varsity{--team:#d12c3f}.month-event.boys{--team:#6c3fb5}.month-event.flag{--team:#168a57}.month-event .mini-head{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:950;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}.month-event.conflicted{outline:2px solid #e04b56}.calendar-legend{display:flex;gap:12px;flex-wrap:wrap;margin:13px 0 0}.legend-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:850;color:#52657d}.legend-swatch{width:12px;height:12px;border-radius:4px}.legend-swatch.jv{background:#176fc2}.legend-swatch.varsity{background:#d12c3f}.legend-swatch.boys{background:#6c3fb5}.legend-swatch.flag{background:#168a57}
    @media(max-width:980px){.team-key{grid-template-columns:1fr 1fr}.game-card{grid-template-columns:54px 28px 1fr}.month-grid{overflow-x:auto}.day,.dow{min-width:140px}}@media(max-width:620px){.calendar-shell{padding:14px}.calendar-metrics,.team-key{grid-template-columns:1fr}.game-card{grid-template-columns:52px 1fr;gap:7px}.sport-icon{display:none}.month-grid{grid-template-columns:repeat(7,140px);overflow:auto}}
  </style>
</head>
<body>
  <main class="calendar-shell">
    <div class="calendar-head"><div><div class="eyebrow">Admin only</div><h1>Athletics Master Calendar</h1><p>Games only • color-coded by sport and team • conflicts flagged automatically</p><small id="adminEmail"></small></div><div class="calendar-actions"><a class="btn btn-secondary" href="admin.html">← Athletics Admin</a><button id="logoutBtn" class="btn btn-secondary">Sign Out</button></div></div>
    <div class="calendar-metrics"><div class="card"><span class="metric-label">Teams</span><div id="teamMetric" class="metric">0</div></div><div class="card"><span class="metric-label">Games Loaded</span><div id="gameMetric" class="metric">0</div></div><div class="card"><span class="metric-label">Game Conflicts</span><div id="conflictMetric" class="metric">0</div></div></div>
    <div id="teamKey" class="team-key"></div>
    <section class="calendar-section"><h2>⚠️ Game Conflicts</h2><div id="conflicts" style="margin-top:12px"></div></section>
    <div class="toolbar"><div class="view-actions"><button class="view-btn active" data-view="list" type="button">☰ List</button><button class="view-btn" data-view="month" type="button">🗓 Monthly Calendar</button></div><div id="monthControls" class="month-actions hidden"><button id="prevMonth" class="btn btn-secondary" type="button">←</button><div id="monthTitle" class="month-title"></div><button id="nextMonth" class="btn btn-secondary" type="button">→</button></div></div>
    <section id="listView" class="calendar-section"><h2>🏆 Upcoming Games</h2><div id="gameList"></div></section>
    <section id="monthView" class="calendar-section hidden"><div id="monthGrid" class="month-grid"></div><div class="calendar-legend"><span class="legend-chip"><span class="legend-swatch jv"></span>🏐 JV Girls</span><span class="legend-chip"><span class="legend-swatch varsity"></span>🏐 Varsity Girls</span><span class="legend-chip"><span class="legend-swatch boys"></span>🏐 Boys</span><span class="legend-chip"><span class="legend-swatch flag"></span>🏈 Co-ed Flag Football</span></div></section>
  </main>
  <script type="module">
    import { requireVerifiedUser, logout } from './js/auth.js';
    import { TEAM_DATA } from './teams/shared/team-data.js?v=20260904-5';
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
    const teams=Object.values(TEAM_DATA),YEAR=2026;
    function teamClass(team){if(team.id==='jv-girls-volleyball')return'jv';if(team.id==='varsity-girls-volleyball')return'varsity';if(team.id==='boys-volleyball')return'boys';if(team.id==='co-ed-flag-football')return'flag';return'jv';}
    function teamLabel(team){if(team.id==='jv-girls-volleyball')return'JV Girls';if(team.id==='varsity-girls-volleyball')return'Varsity Girls';if(team.id==='boys-volleyball')return'Boys';if(team.id==='co-ed-flag-football')return'Co-ed';return team.title;}
    function teamShort(team){if(team.id==='jv-girls-volleyball')return'JV GIRLS';if(team.id==='varsity-girls-volleyball')return'VARSITY';if(team.id==='boys-volleyball')return'BOYS';if(team.id==='co-ed-flag-football')return'CO-ED';return teamLabel(team);}
    function sportLabel(team){return /flag/i.test(team.sport)?'Flag Football':'Volleyball';}function sportIcon(team){return /flag/i.test(team.sport)?'🏈':'🏐';}
    function parseTime(text){const m=String(text||'').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);if(!m)return null;let h=Number(m[1]);const min=Number(m[2]||0),ap=m[3].toUpperCase();if(h===12)h=0;if(ap==='PM')h+=12;return h*60+min;}
    function parseDate(game){const d=new Date(`${game.date}, ${YEAR} ${game.time||'12:00 PM'}`);return Number.isNaN(d.getTime())?null:d;}function gameRange(game){const start=parseTime(game.time);return start==null?null:{start,end:start+90};}function rangesOverlap(a,b){return a&&b&&a.start<b.end&&b.start<a.end;}
    const allGames=[];for(const team of teams){for(const game of team.games||[]){const date=parseDate(game);if(date)allGames.push({team,game,date});}}allGames.sort((a,b)=>a.date-b.date);
    const conflicts=[],conflictedGames=new Set();for(let i=0;i<allGames.length;i++){for(let j=i+1;j<allGames.length;j++){const a=allGames[i],b=allGames[j];if(a.team.id===b.team.id)continue;const sameDay=a.date.getFullYear()===b.date.getFullYear()&&a.date.getMonth()===b.date.getMonth()&&a.date.getDate()===b.date.getDate();if(sameDay&&rangesOverlap(gameRange(a.game),gameRange(b.game))){conflicts.push({a,b});conflictedGames.add(a);conflictedGames.add(b);}}}
    function gameMeta(game){return [game.location||'',game.address||''].filter(Boolean).join(' • ');}function renderTeamKey(){document.getElementById('teamKey').innerHTML=teams.map(team=>`<div class="team-key-card ${teamClass(team)}"><div class="team-key-icon">${sportIcon(team)}</div><div class="team-key-name">${esc(teamLabel(team))}</div><div class="team-key-sub">${esc(sportLabel(team))}</div><div class="team-key-count">${(team.games||[]).length}<small>games</small></div></div>`).join('');}
    function renderConflicts(){const host=document.getElementById('conflicts');if(!conflicts.length){host.innerHTML='<div class="card"><div class="empty">✅ No overlapping games found.</div></div>';return;}host.innerHTML=conflicts.map(({a,b})=>`<div class="card conflict-box" style="margin-bottom:10px"><strong>⚠️ Game conflict • ${esc(a.game.date)}</strong><div class="game-team">${esc(a.team.title)} at ${esc(a.game.time)} + ${esc(b.team.title)} at ${esc(b.game.time)}</div><div class="game-meta">Both games overlap using a 90-minute game window.</div></div>`).join('');}
    function renderCard(item){const {team,game,date}=item,cls=teamClass(team);return `<div class="game-card ${cls} ${conflictedGames.has(item)?'conflict':''}"><div class="date-block"><div class="month">${date.toLocaleDateString('en-US',{month:'short'})}</div><div class="day">${date.getDate()}</div><div class="time">${esc(game.time)}</div></div><div class="sport-icon">${sportIcon(team)}</div><div><div class="identity-row"><span class="sport-badge">${esc(sportLabel(team))}</span><span class="team-badge">${esc(teamLabel(team))}</span></div><div class="game-mainline"><span class="game-team">${esc(team.title)}</span><span class="game-opponent">vs. ${esc(game.opponent||'Opponent pending')}</span></div>${gameMeta(game)?`<div class="game-meta">📍 ${esc(gameMeta(game))}</div>`:''}</div><div class="game-status"><div class="team-short">${esc(teamShort(team))}</div><div class="sport-word">${sportIcon(team)} ${esc(sportLabel(team))}</div></div></div>`;}
    function renderGroups(items){const byMonth=new Map();for(const item of items){const key=item.date.toLocaleDateString('en-US',{month:'long',year:'numeric'});if(!byMonth.has(key))byMonth.set(key,[]);byMonth.get(key).push(item);}return [...byMonth.entries()].map(([month,rows])=>`<div class="month-group"><div class="month-group-title">🗓 ${esc(month)}</div>${rows.map(renderCard).join('')}</div>`).join('');}
    function renderList(){const startToday=new Date();startToday.setHours(0,0,0,0);const upcoming=allGames.filter(item=>item.date>=startToday),past=allGames.filter(item=>item.date<startToday);let html=upcoming.length?renderGroups(upcoming):'<div class="card"><div class="empty">No upcoming games entered.</div></div>';if(past.length)html+=`<details class="past-games"><summary>Past Games <span>${past.length}</span></summary><div class="past-games-body">${renderGroups(past)}</div></details>`;document.getElementById('gameList').innerHTML=html;}
    let currentMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);function renderMonth(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();document.getElementById('monthTitle').textContent=currentMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const outside=d.getMonth()!==m,dayGames=allGames.filter(item=>item.date.getFullYear()===d.getFullYear()&&item.date.getMonth()===d.getMonth()&&item.date.getDate()===d.getDate());cells.push(`<div class="day ${outside?'outside':''}"><div class="day-number">${d.getDate()}</div>${dayGames.map(item=>{const cls=teamClass(item.team);return `<div class="month-event ${cls} ${conflictedGames.has(item)?'conflicted':''}"><div class="mini-head">${sportIcon(item.team)} ${esc(teamShort(item.team))}</div>${esc(item.game.time)}<br>vs. ${esc(item.game.opponent||'TBD')}</div>`;}).join('')}</div>`);}document.getElementById('monthGrid').innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')+cells.join('');}
    function setView(view){document.querySelectorAll('[data-view]').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));document.getElementById('listView').classList.toggle('hidden',view!=='list');document.getElementById('monthView').classList.toggle('hidden',view!=='month');document.getElementById('monthControls').classList.toggle('hidden',view!=='month');if(view==='month')renderMonth();}
    document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.view)));document.getElementById('prevMonth').addEventListener('click',()=>{currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);renderMonth();});document.getElementById('nextMonth').addEventListener('click',()=>{currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,1);renderMonth();});
    const user=await requireVerifiedUser({admin:true});document.getElementById('adminEmail').textContent=user.email||'';document.getElementById('logoutBtn').addEventListener('click',logout);document.getElementById('teamMetric').textContent=teams.length;document.getElementById('gameMetric').textContent=allGames.length;document.getElementById('conflictMetric').textContent=conflicts.length;renderTeamKey();renderConflicts();renderList();
  </script>
</body>
</html>
