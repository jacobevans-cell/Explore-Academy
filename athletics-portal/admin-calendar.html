<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Athletics Admin Calendar | Explore Academy</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .calendar-shell{max-width:1320px;margin:auto;padding:24px}
    .calendar-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .calendar-head h1{margin:0;color:var(--navy);letter-spacing:-.04em}.calendar-head p{margin:8px 0 0;color:var(--muted)}
    .calendar-actions,.view-actions,.month-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .calendar-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 22px}
    .calendar-section{margin-top:24px}.calendar-section h2{margin:0;color:var(--navy)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0 14px}
    .view-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.view-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .event{--team:#176fc2;display:grid;grid-template-columns:135px minmax(0,1fr);gap:16px;align-items:start;padding:18px 18px 18px 22px;border-bottom:1px solid var(--line);border-left:8px solid var(--team);background:#fff}
    .event:last-child{border-bottom:0}.event-time{font-weight:950;color:var(--navy);font-size:16px}.event-title{font-weight:950;color:var(--ink);font-size:18px;margin-top:5px}.event-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
    .identity-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.sport-badge,.team-badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}.sport-badge{background:#e8eef5;color:#38516d}.team-badge{background:color-mix(in srgb,var(--team) 14%,white);color:var(--team);border:1px solid color-mix(in srgb,var(--team) 30%,white)}
    .event.jv{--team:#176fc2}.event.varsity{--team:#bf1e2e}.event.boys{--team:#6c3fb5}.event.flag{--team:#1d8a57}
    .conflict{box-shadow:inset 0 0 0 2px #ffd5d9;background:#fff9f9}.conflict strong{color:var(--danger)}
    .empty{color:var(--muted);padding:18px 0}.hidden{display:none!important}
    .month-title{font-size:20px;font-weight:950;color:var(--navy);min-width:180px;text-align:center}
    .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.dow{padding:10px;background:#f4f8fc;color:#53677f;text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:900;border-right:1px solid var(--line)}.dow:nth-child(7){border-right:0}
    .day{min-height:150px;padding:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff}.day:nth-child(7n){border-right:0}.day.outside{background:#f8fafc;color:#9aa6b6}.day-number{font-size:12px;font-weight:950;color:var(--navy);margin-bottom:8px}.day.outside .day-number{color:#aab4c0}
    .month-event{--team:#176fc2;display:block;margin:6px 0 0;padding:7px 8px;border-radius:8px;background:color-mix(in srgb,var(--team) 11%,white);color:var(--team);border-left:4px solid var(--team);font-size:10px;font-weight:850;line-height:1.25}.month-event.jv{--team:#176fc2}.month-event.varsity{--team:#bf1e2e}.month-event.boys{--team:#6c3fb5}.month-event.flag{--team:#1d8a57}.month-event .mini-team{display:block;font-size:9px;font-weight:950;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}.month-event.conflicted{outline:2px solid #e04b56}
    .calendar-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}.legend-chip{display:inline-flex;align-items:center;gap:6px}.legend-swatch{width:11px;height:11px;border-radius:3px}.legend-swatch.jv{background:#176fc2}.legend-swatch.varsity{background:#bf1e2e}.legend-swatch.boys{background:#6c3fb5}.legend-swatch.flag{background:#1d8a57}
    @media(max-width:900px){.calendar-metrics{grid-template-columns:1fr 1fr}.event{grid-template-columns:115px 1fr}.month-grid{overflow-x:auto}.day,.dow{min-width:140px}}
    @media(max-width:620px){.calendar-shell{padding:14px}.calendar-metrics{grid-template-columns:1fr}.event{grid-template-columns:1fr}.month-grid{display:grid;grid-template-columns:repeat(7,140px);overflow:auto}}
  </style>
</head>
<body>
  <main class="calendar-shell">
    <div class="calendar-head"><div><div class="eyebrow">Admin only</div><h1>Athletics Master Calendar</h1><p>Games only. Practices and player conflicts are intentionally excluded.</p><small id="adminEmail"></small></div><div class="calendar-actions"><a class="btn btn-secondary" href="admin.html">← Athletics Admin</a><button id="logoutBtn" class="btn btn-secondary">Sign Out</button></div></div>
    <div class="calendar-metrics"><div class="card"><span class="metric-label">Teams</span><div id="teamMetric" class="metric">0</div></div><div class="card"><span class="metric-label">Games Loaded</span><div id="gameMetric" class="metric">0</div></div><div class="card"><span class="metric-label">Game Conflicts</span><div id="conflictMetric" class="metric">0</div></div></div>
    <section class="calendar-section"><h2>Game Conflicts</h2><div id="conflicts" style="margin-top:12px"></div></section>
    <div class="toolbar"><div class="view-actions"><button class="view-btn active" data-view="list" type="button">List</button><button class="view-btn" data-view="month" type="button">Monthly Calendar</button></div><div id="monthControls" class="month-actions hidden"><button id="prevMonth" class="btn btn-secondary" type="button">←</button><div id="monthTitle" class="month-title"></div><button id="nextMonth" class="btn btn-secondary" type="button">→</button></div></div>
    <section id="listView" class="calendar-section"><h2>All Games</h2><div id="gameList" class="card" style="margin-top:12px;padding:0;overflow:hidden"></div></section>
    <section id="monthView" class="calendar-section hidden"><div id="monthGrid" class="month-grid"></div><div class="calendar-legend"><span class="legend-chip"><span class="legend-swatch jv"></span>JV Girls Volleyball</span><span class="legend-chip"><span class="legend-swatch varsity"></span>Varsity Girls Volleyball</span><span class="legend-chip"><span class="legend-swatch boys"></span>Boys Volleyball</span><span class="legend-chip"><span class="legend-swatch flag"></span>Co-ed Flag Football</span></div></section>
  </main>
  <script type="module">
    import { requireVerifiedUser, logout } from './js/auth.js';
    import { TEAM_DATA } from './teams/shared/team-data.js';
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
    const teams=Object.values(TEAM_DATA); const YEAR=2026;
    function teamClass(team){if(team.id==='jv-girls-volleyball')return'jv';if(team.id==='varsity-girls-volleyball')return'varsity';if(team.id==='boys-volleyball')return'boys';if(team.id==='co-ed-flag-football')return'flag';return'jv';}
    function teamLabel(team){if(team.id==='jv-girls-volleyball')return'JV Girls';if(team.id==='varsity-girls-volleyball')return'Varsity Girls';if(team.id==='boys-volleyball')return'Boys';if(team.id==='co-ed-flag-football')return'Co-ed';return team.title;}
    function sportLabel(team){return /flag/i.test(team.sport)?'Flag Football':'Volleyball';}
    function parseTime(text){const m=String(text||'').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);if(!m)return null;let h=Number(m[1]);const min=Number(m[2]||0),ap=m[3].toUpperCase();if(h===12)h=0;if(ap==='PM')h+=12;return h*60+min;}
    function parseDate(game){const d=new Date(`${game.date}, ${YEAR} ${game.time||'12:00 PM'}`);return Number.isNaN(d.getTime())?null:d;}
    function gameRange(game){const start=parseTime(game.time);return start==null?null:{start,end:start+90};}
    function rangesOverlap(a,b){return a&&b&&a.start<b.end&&b.start<a.end;}
    const allGames=[];for(const team of teams){for(const game of team.games||[]){const date=parseDate(game);if(date)allGames.push({team,game,date});}}allGames.sort((a,b)=>a.date-b.date);
    const conflicts=[];const conflictedGames=new Set();for(let i=0;i<allGames.length;i++){for(let j=i+1;j<allGames.length;j++){const a=allGames[i],b=allGames[j];if(a.team.id===b.team.id)continue;const sameDay=a.date.getFullYear()===b.date.getFullYear()&&a.date.getMonth()===b.date.getMonth()&&a.date.getDate()===b.date.getDate();if(!sameDay)continue;if(rangesOverlap(gameRange(a.game),gameRange(b.game))){conflicts.push({a,b});conflictedGames.add(a);conflictedGames.add(b);}}}
    function gameMeta(team,game){return [game.location||'',game.address||''].filter(Boolean).join(' • ');}
    function renderConflicts(){const host=document.getElementById('conflicts');if(!conflicts.length){host.innerHTML='<div class="card"><div class="empty">No overlapping games found.</div></div>';return;}host.innerHTML=conflicts.map(({a,b})=>`<div class="card conflict" style="margin-bottom:10px"><strong>Game conflict • ${esc(a.game.date)}</strong><div class="event-title">${esc(a.team.title)} at ${esc(a.game.time)} and ${esc(b.team.title)} at ${esc(b.game.time)}</div><div class="event-meta">Both games overlap using a 90-minute game window.</div></div>`).join('');}
    function renderList(){const host=document.getElementById('gameList');host.innerHTML=allGames.length?allGames.map(item=>{const {team,game}=item,cls=teamClass(team);return `<div class="event ${cls} ${conflictedGames.has(item)?'conflict':''}"><div class="event-time">${esc(game.date)}<br>${esc(game.time)}</div><div><div class="identity-row"><span class="sport-badge">${esc(sportLabel(team))}</span><span class="team-badge">${esc(teamLabel(team))}</span></div><div class="event-title">${esc(team.title)}</div><div class="event-meta">${game.opponent?`vs. ${esc(game.opponent)}`:'Opponent pending'}${gameMeta(team,game)?` • ${esc(gameMeta(team,game))}`:''}</div></div></div>`;}).join(''):'<div class="empty">No games entered yet.</div>';}
    let currentMonth=allGames.length?new Date(allGames[0].date.getFullYear(),allGames[0].date.getMonth(),1):new Date(YEAR,7,1);
    function renderMonth(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();document.getElementById('monthTitle').textContent=currentMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const outside=d.getMonth()!==m;const dayGames=allGames.filter(item=>item.date.getFullYear()===d.getFullYear()&&item.date.getMonth()===d.getMonth()&&item.date.getDate()===d.getDate());cells.push(`<div class="day ${outside?'outside':''}"><div class="day-number">${d.getDate()}</div>${dayGames.map(item=>{const cls=teamClass(item.team);return `<div class="month-event ${cls} ${conflictedGames.has(item)?'conflicted':''}"><span class="mini-team">${esc(teamLabel(item.team))} • ${esc(sportLabel(item.team))}</span>${esc(item.game.time)} • ${item.game.opponent?`vs. ${esc(item.game.opponent)}`:'Opponent pending'}</div>`;}).join('')}</div>`);}document.getElementById('monthGrid').innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')+cells.join('');}
    function setView(view){document.querySelectorAll('[data-view]').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));document.getElementById('listView').classList.toggle('hidden',view!=='list');document.getElementById('monthView').classList.toggle('hidden',view!=='month');document.getElementById('monthControls').classList.toggle('hidden',view!=='month');if(view==='month')renderMonth();}
    document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.view)));document.getElementById('prevMonth').addEventListener('click',()=>{currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);renderMonth();});document.getElementById('nextMonth').addEventListener('click',()=>{currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,1);renderMonth();});
    const user=await requireVerifiedUser({admin:true});document.getElementById('adminEmail').textContent=user.email||'';document.getElementById('logoutBtn').addEventListener('click',logout);document.getElementById('teamMetric').textContent=teams.length;document.getElementById('gameMetric').textContent=allGames.length;document.getElementById('conflictMetric').textContent=conflicts.length;renderConflicts();renderList();
  </script>
</body>
</html>
